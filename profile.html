<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Setdrop</title>
<meta name="theme-color" content="#09090F">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090F;--cyan:#00D2FF;--white:#F0F0FF;--muted:#888AAA;--dim:#3A3A5A;
  --green:#1D9E75;--red:#C0392B;--gold:#D4A017;
  --glass:rgba(9,9,15,0.62);--gb:rgba(255,255,255,0.09);--r:14px;--max:480px;
  --font:'DM Sans',system-ui,sans-serif;
  --sp-sec:10px;--sp-inner:16px
}
html{background:var(--bg);-webkit-font-smoothing:antialiased}
body{min-height:100vh;font-family:var(--font);color:var(--white);background:var(--bg);overflow-x:hidden}

/* ── BACKGROUND — truly fixed, no scroll ── */
#bgi{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center top;opacity:0;transition:opacity 1.1s ease;pointer-events:none}
#bgi.on{opacity:1}
#bgg{position:fixed;inset:0;z-index:0;background:linear-gradient(to bottom,rgba(9,9,15,.15) 0%,rgba(9,9,15,.38) 28%,rgba(9,9,15,.78) 58%,rgba(9,9,15,.97) 100%);pointer-events:none}

/* ── LOADING ── */
#ld{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:14px;transition:opacity .4s}
#ld.gone{opacity:0;pointer-events:none}
.brand{font-size:18px;font-weight:700}.brand .w{color:var(--white)}.brand .d{color:var(--cyan)}
.spin{width:20px;height:20px;border:2px solid rgba(0,210,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldm{font-size:12px;color:var(--muted)}

/* ── STATUS pill — fixed top-left ── */
#spp{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:50;
  display:none;align-items:center;gap:5px;
  background:rgba(5,5,8,.82);border:.5px solid rgba(255,255,255,.13);
  border-radius:20px;padding:4px 10px 4px 8px;font-size:10px;font-weight:500;color:var(--muted);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.spdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.spdot.online{background:var(--green)}.spdot.live{background:var(--red);animation:pd 1.4s ease-in-out infinite}
@keyframes pd{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}

/* ── LAYOUT ── */
#pg{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding-bottom:110px}

/* ── HERO ── */
.hero{padding:calc(max(56px,env(safe-area-inset-top)) + 18px) 20px 18px;display:flex;flex-direction:column;align-items:center;text-align:center}
.avw{position:relative;margin-bottom:12px}
.av{width:80px;height:80px;border-radius:50%;border:2px solid var(--cyan);background:rgba(0,210,255,.1);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--cyan)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.vbdg{position:absolute;bottom:-1px;right:-1px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--bg);align-items:center;justify-content:center;display:none}
.nm{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.15;margin-bottom:3px}
.hnd{font-size:11px;color:var(--muted);margin-bottom:6px}
.loc{font-size:11px;color:var(--muted);margin-bottom:8px;display:none}

/* availability pills — top of profile */
.avpills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px}
.avp{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:4px 11px;font-size:10px;font-weight:600}
.avp-book{background:rgba(29,158,117,.1);border:1px solid rgba(29,158,117,.28);color:var(--green)}
.avp-collab{background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.22);color:var(--cyan)}
.avp-live{background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);color:#E74C3C}
.avdot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.avdot.pulse{animation:pd 1.4s ease-in-out infinite}

/* genre + type pills */
.pills{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.gp{font-size:10px;font-weight:500;background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.22);color:var(--cyan);border-radius:20px;padding:3px 9px}
.tp{font-size:10px;font-weight:500;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:var(--muted);border-radius:20px;padding:3px 9px}

/* featured badge */
#fbadge-wrap{margin-top:9px;display:none}
.fbadge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 13px;font-size:11px;font-weight:700}
.fbadge.founding{background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.3);color:var(--gold)}
.fbadge.verified{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--white)}
.fbadge.collab{background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.22);color:var(--green)}
.fbadge.top{background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.22);color:var(--cyan)}

/* ── STATS ── */
.stats{display:flex;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--gb);border-bottom:1px solid var(--gb);margin-top:12px}
.si{flex:1;padding:13px 0;text-align:center;position:relative}
.si+.si::before{content:'';position:absolute;left:0;top:24%;bottom:24%;width:1px;background:var(--gb)}
.sv{font-size:18px;font-weight:700;letter-spacing:-.5px;line-height:1}
.sv.c{color:var(--cyan)}
.sl{font-size:9px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}

/* ── SECTIONS ── */
.sec{margin:var(--sp-sec) 14px 0;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--gb);border-radius:var(--r);overflow:hidden}
.sec.sep-line + .sec.sep-line{border-top:none;border-radius:0;margin-top:0}
.si2{padding:var(--sp-inner)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.st{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.1px;text-transform:uppercase}
.slnk{font-size:11px;color:var(--cyan);font-weight:500;text-decoration:none}
/* separator styles */
.sep-none .sec{border-top:none}
.sep-dots .sec::before{content:'···';display:block;text-align:center;color:var(--dim);font-size:14px;letter-spacing:4px;padding:6px 0 0}

/* ── ABOUT ── */
.abt{font-size:13px;color:#CCC;line-height:1.72}

/* ── EPK ── */
.epk-grid{display:flex;flex-direction:column;gap:12px}
.epk-row{display:flex;flex-direction:column;gap:3px}
.epk-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.epk-val{font-size:13px;color:#CCC;line-height:1.65}
.epk-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.epk-link{font-size:11px;color:var(--cyan);background:rgba(0,210,255,.06);border:1px solid rgba(0,210,255,.18);border-radius:6px;padding:3px 9px;text-decoration:none}

/* ── AVAILABILITY ── */
.avail-chips{display:flex;gap:6px;flex-wrap:wrap}
.ach{display:flex;align-items:center;gap:6px;background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.2);border-radius:20px;padding:6px 12px}
.ad{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
.adate{font-size:11px;font-weight:600;color:var(--green)}

/* ── BADGES ── */
.bgr{display:flex;gap:6px;flex-wrap:wrap}
.bp{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600}
.bpf{background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.28);color:var(--gold)}
.bpv{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);color:var(--white)}
.bpc{background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.22);color:var(--cyan)}
.bpg{background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.2);color:var(--green)}

/* ── LINKS ── */
.lkl{display:flex;flex-direction:column}
.lk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);text-decoration:none;-webkit-tap-highlight-color:transparent}
.lk:last-child{border-bottom:none}
.lic{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.lt{flex:1;min-width:0}
.ln{font-size:12px;font-weight:600;color:var(--white)}
.lh{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lar svg{width:13px;height:13px;stroke:var(--dim)}
/* featured link highlight */
.lk.feat{background:rgba(0,210,255,.04);margin:0 -16px;padding:10px 16px;border-radius:8px}
.lk.feat .ln{color:var(--cyan)}

/* ── PRESS ── */
.qtl{display:flex;flex-direction:column;gap:14px}
.qt{padding-left:12px;border-left:2px solid rgba(0,210,255,.35)}
.qb{font-size:13px;font-style:italic;color:#CCC;line-height:1.65}
.qs{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

/* ── GIGS ── */
.gigs-list{display:flex;flex-direction:column}
.gig-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.gig-row:last-child{border-bottom:none}
.gig-date{min-width:40px;text-align:center;line-height:1.2}
.gig-day{font-size:15px;font-weight:700;letter-spacing:-.3px;display:block}
.gig-mon{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.gig-info{flex:1;min-width:0}
.gig-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig-venue{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig-badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.gig-badge.done{background:rgba(29,158,117,.1);border:1px solid rgba(29,158,117,.2);color:var(--green)}
.gig-badge.conf{background:rgba(0,210,255,.07);border:1px solid rgba(0,210,255,.17);color:var(--cyan)}

/* ── MEDIA ── */
.mgd{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mc{aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--gb);overflow:hidden;position:relative;cursor:pointer}
.mc img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .15s}
.mc:active img{opacity:.8}
.mc-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mc-play svg{width:30px;height:30px;filter:drop-shadow(0 1px 4px rgba(0,0,0,.5))}
.mc-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--dim)}

/* ── REVIEWS ── */
.rev-list{display:flex;flex-direction:column}
.rev{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.rev:last-child{border-bottom:none}
.rev-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.rev-by{font-size:12px;font-weight:600}
.rev-stars{display:flex;gap:2px}
.rev-star{font-size:11px;color:var(--gold)}.rev-star.off{color:var(--dim)}
.rev-body{font-size:12px;color:#CCC;line-height:1.62}
.rev-date{font-size:10px;color:var(--muted);margin-top:4px}

/* ── FOOTER ── */
.pft{text-align:center;padding:22px 0 18px;font-size:11px;color:var(--dim)}
.pft a{color:var(--muted);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.pft a .d{color:var(--cyan)}
.pft a svg{width:12px;height:12px;stroke:var(--muted);flex-shrink:0}

/* ── NOT FOUND ── */
.nfs{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px;text-align:center;gap:12px}
.nfs h2{font-size:20px;font-weight:700;margin-top:8px}
.nfs p{font-size:14px;color:var(--muted)}
.nfs a{color:var(--cyan);text-decoration:none;font-size:13px;font-weight:500;margin-top:4px}

/* ── ACTION BAR ── */
.abar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max);padding:12px 14px max(12px,env(safe-area-inset-bottom));background:rgba(9,9,15,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--gb);display:none;gap:8px;z-index:50}
.bfl{flex:1;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--gb);background:rgba(255,255,255,.06);color:var(--white);font-family:inherit;transition:all .15s}
.bfl.on{color:var(--cyan);border-color:rgba(0,210,255,.3);background:rgba(0,210,255,.06)}
.bsh{width:46px;height:46px;flex-shrink:0;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bsh svg{width:16px;height:16px;stroke:var(--muted)}

/* ── COLOUR SCHEMES ── */
body.scheme-warm{--cyan:#FF9F43;--green:#26de81}
body.scheme-cool{--cyan:#74b9ff;--green:#00cec9}
body.scheme-dark{--glass:rgba(0,0,0,.75)}
body.scheme-mono{--cyan:var(--white);--gold:var(--white)}
</style>
</head>
<body>

<div id="bgi"></div>
<div id="bgg"></div>
<div id="spp"><div class="spdot" id="spd"></div><span id="spl"></span></div>

<div id="ld">
  <div class="brand" style="display:flex;align-items:center;gap:6px">
    <img src="/logo-transparent.png" width="26" height="26" style="display:block">
    <span><span class="w">set<span class="d">drop</span></span></span>
  </div>
  <div class="spin"></div>
  <div class="ldm">Loading profile</div>
</div>

<div id="prf" style="display:none">
  <div id="pg">

    <div class="hero">
      <div class="avw">
        <div class="av" id="av"></div>
        <div class="vbdg" id="vbdg"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="var(--cyan)"/><path d="M7 12.5l3.5 3.5 6.5-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="nm" id="nm">—</div>
      <div class="hnd" id="hnd"></div>
      <div class="loc" id="loc"></div>
      <!-- Availability pills at top -->
      <div class="avpills" id="avpills"></div>
      <div class="pills" id="pills"></div>
      <div id="fbadge-wrap"><div id="fbadge"></div></div>
    </div>

    <!-- Stats: Followers · Gigs · Rating · Years -->
    <div class="stats">
      <div class="si"><div class="sv c" id="sf">0</div><div class="sl">Followers</div></div>
      <div class="si"><div class="sv" id="sg">0</div><div class="sl">Gigs</div></div>
      <div class="si"><div class="sv" id="sr">—</div><div class="sl">Rating</div></div>
      <div class="si"><div class="sv" id="sy">—</div><div class="sl">Years</div></div>
    </div>

    <!-- Sections rendered dynamically in section_order -->
    <div id="sections"></div>

    <div class="pft"><a href="https://setdrop.com.au" style="display:inline-flex;align-items:center;gap:7px"><img src="/logo-transparent.png" width="18" height="18" style="display:block;opacity:.6"><span><span class="w">set<span class="d">drop</span></span></span><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;stroke:var(--muted)"><path d="M5 12h14M12 5l7 7-7 7"/></svg><span>Get your profile</span></a></div>
  </div>
</div>

<div id="nf" style="display:none">
  <div class="nfs">
    <div class="brand"><span class="w">set<span class="d">drop</span></span></div>
    <h2>Profile not found</h2>
    <p>This artist doesn't exist or their profile is private.</p>
    <a href="/">Back to Setdrop</a>
  </div>
</div>

<div class="abar" id="abar">
  <button class="bfl" id="bfl" onclick="toggleFollow()">Follow</button>
  <button class="bsh" onclick="doShare()">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
      <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
    </svg>
  </button>
</div>

<script>
const SB='https://hlqmsujjnwicclyecpkz.supabase.co';
const K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhscW1zdWpqbndpY2NseWVjcGt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NTU0NDcsImV4cCI6MjA4OTEzMTQ0N30.BTgsCMxNZ1SYJf6lEpsVucm1qwJ4phmp1ooWeuX6HxQ';
const H={apikey:K,Authorization:`Bearer ${K}`};

const PL={
  instagram:{l:'Instagram',bg:'rgba(225,48,108,.12)',c:'#E1306C'},
  spotify:{l:'Spotify',bg:'rgba(30,215,96,.1)',c:'#1ED760'},
  soundcloud:{l:'SoundCloud',bg:'rgba(255,85,0,.1)',c:'#FF5500'},
  tiktok:{l:'TikTok',bg:'rgba(255,255,255,.07)',c:'#F0F0FF'},
  youtube:{l:'YouTube',bg:'rgba(255,0,0,.1)',c:'#FF4444'},
  mixcloud:{l:'Mixcloud',bg:'rgba(82,46,140,.15)',c:'#7B52AE'},
  bandcamp:{l:'Bandcamp',bg:'rgba(29,201,179,.1)',c:'#1DC9B3'},
  apple_music:{l:'Apple Music',bg:'rgba(250,60,60,.1)',c:'#FA3C3C'},
  twitter:{l:'Twitter/X',bg:'rgba(255,255,255,.06)',c:'#888AAA'},
  facebook:{l:'Facebook',bg:'rgba(24,119,242,.1)',c:'#1877F2'},
  website:{l:'Website',bg:'rgba(255,255,255,.06)',c:'#888AAA'},
};

const FEAT_BADGE={
  founding_artist:{cls:'founding',label:'Founding Artist',icon:'★'},
  verified:{cls:'verified',label:'Verified Artist'},
  top_artist:{cls:'top',label:'Top Artist'},
  open_to_collab:{cls:'collab',label:'Open to Collab'},
};

const FONTS={
  dm_sans:"'DM Sans',system-ui,sans-serif",
  space_grotesk:"'Space Grotesk',system-ui,sans-serif",
  syne:"'Syne',system-ui,sans-serif",
};

function slug(){const m=window.location.pathname.match(/\/@([^/]+)/);return m?m[1]:(new URLSearchParams(window.location.search).get('u')||'demo');}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':String(n);}

async function load(u){
  const r=await fetch(`${SB}/rest/v1/artist_profiles?username=eq.${encodeURIComponent(u)}&select=*&limit=1`,{headers:H});
  if(!r.ok)return null;
  const rows=await r.json();if(!rows.length)return null;
  const p=rows[0];

  const[links,badges,cfgRows,epkRows,followers,gigCount,reviews,bookings]=await Promise.all([
    fetch(`${SB}/rest/v1/artist_links?artist_id=eq.${p.id}&order=sort_order.asc`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/artist_badges?artist_id=eq.${p.id}`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/artist_profile_config?artist_id=eq.${p.id}&limit=1`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/artist_epk?artist_id=eq.${p.id}&limit=1`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/follows?following_id=eq.${p.id}&select=id`,{headers:{...H,Prefer:'count=exact',Range:'0-0'}})
      .then(r=>{const h=r.headers.get('content-range');return h?parseInt(h.split('/')[1])||0:0;}).catch(()=>0),
    fetch(`${SB}/rest/v1/bookings?artist_id=eq.${p.id}&status=eq.completed&select=id`,{headers:{...H,Prefer:'count=exact',Range:'0-0'}})
      .then(r=>{const h=r.headers.get('content-range');return h?parseInt(h.split('/')[1])||0:0;}).catch(()=>0),
    fetch(`${SB}/rest/v1/reviews?reviewee_id=eq.${p.id}&select=overall,comment,submitted_at&order=submitted_at.desc&limit=5`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/bookings?artist_id=eq.${p.id}&select=id,status,gig_id,org_id&order=created_at.desc&limit=8`,{headers:H}).then(r=>r.ok?r.json():[]),
  ]);

  const cfg=cfgRows[0]||null;
  const epk=epkRows[0]||null;

  // Fetch gig + org details for bookings
  let gigDetails={},orgDetails={};
  if(bookings.length){
    const gids=[...new Set(bookings.map(b=>b.gig_id).filter(Boolean))];
    const oids=[...new Set(bookings.map(b=>b.org_id).filter(Boolean))];
    const[gr,or]=await Promise.all([
      gids.length?fetch(`${SB}/rest/v1/gig_postings?id=in.(${gids.map(i=>`"${i}"`).join(',')})&select=id,title,event_date,location_city`,{headers:H}).then(r=>r.ok?r.json():[]):Promise.resolve([]),
      oids.length?fetch(`${SB}/rest/v1/org_profiles?id=in.(${oids.map(i=>`"${i}"`).join(',')})&select=id,org_name`,{headers:H}).then(r=>r.ok?r.json():[]):Promise.resolve([]),
    ]);
    gigDetails=Object.fromEntries(gr.map(g=>[g.id,g]));
    orgDetails=Object.fromEntries(or.map(o=>[o.id,o]));
  }

  return{...p,links,badges,cfg,epk,followers,gigCount,reviews,bookings,gigDetails,orgDetails};
}

function applyCustomisation(cfg){
  if(!cfg)return;

  // Font
  const font=FONTS[cfg.font_style]||FONTS.dm_sans;
  document.documentElement.style.setProperty('--font',font);
  document.body.style.fontFamily=font;

  // Colour scheme
  if(cfg.colour_scheme&&cfg.colour_scheme!=='default'){
    document.body.classList.add(`scheme-${cfg.colour_scheme}`);
  }

  // Header colour tint (applied to hero gradient)
  if(cfg.header_colour){
    const bgg=document.getElementById('bgg');
    bgg.style.background=`linear-gradient(to bottom,${cfg.header_colour}22 0%,${cfg.header_colour}11 20%,rgba(9,9,15,.78) 58%,rgba(9,9,15,.97) 100%)`;
  }

  // Spacing style
  if(cfg.spacing_style==='compact'){document.documentElement.style.setProperty('--sp-sec','6px');document.documentElement.style.setProperty('--sp-inner','12px');}
  else if(cfg.spacing_style==='spacious'){document.documentElement.style.setProperty('--sp-sec','16px');document.documentElement.style.setProperty('--sp-inner','22px');}

  // Separator style
  if(cfg.separator_style==='none')document.body.classList.add('sep-none');
  else if(cfg.separator_style==='dots')document.body.classList.add('sep-dots');
}

function render(p){
  document.title=`${p.stage_name} (@${p.username}) · Setdrop`;

  // Apply config-based customisation first
  applyCustomisation(p.cfg);

  // Background: cfg.cover_photo_url > banner_url > photo_url — fixed to screen
  const bgSrc=p.cfg?.cover_photo_url||p.banner_url||p.photo_url;
  if(bgSrc){
    const bgi=document.getElementById('bgi');
    bgi.style.backgroundImage=`url(${bgSrc})`;
    // Force fixed even on mobile (iOS ignores background-attachment:fixed on body)
    bgi.style.willChange='transform';
    setTimeout(()=>bgi.classList.add('on'),60);
  }

  // Avatar
  const av=document.getElementById('av');
  if(p.photo_url)av.innerHTML=`<img src="${esc(p.photo_url)}" alt="">`;
  else av.textContent=(p.stage_name||'?')[0].toUpperCase();
  if(p.verified){const vbdg=document.getElementById('vbdg');vbdg.style.display='flex';}

  // Name / handle / location
  document.getElementById('nm').textContent=p.stage_name||p.username;
  document.getElementById('hnd').textContent=`@${p.username}`;
  if(p.location_city){const l=document.getElementById('loc');l.textContent=p.location_city;l.style.display='block';}

  // Availability pills — top of hero
  const avp=document.getElementById('avpills');
  if(p.live_now){avp.innerHTML+=`<div class="avp avp-live"><span class="avdot pulse"></span>Live Now</div>`;}
  if(p.available){avp.innerHTML+=`<div class="avp avp-book"><span class="avdot"></span>Available to Book</div>`;}
  if(p.open_to_collab){avp.innerHTML+=`<div class="avp avp-collab"><span class="avdot"></span>Open to Collab</div>`;}

  // Status dot (top-left) — only show if live
  if(p.live_now){
    const sp=document.getElementById('spp');
    document.getElementById('spd').className='spdot live';
    document.getElementById('spl').textContent='Live Now';
    sp.style.display='inline-flex';
  }

  // Genre + type pills
  const pills=document.getElementById('pills');
  (p.artist_type||[]).forEach(t=>{const d=document.createElement('div');d.className='tp';d.textContent=t;pills.appendChild(d);});
  (p.genres||[]).forEach(g=>{const d=document.createElement('div');d.className='gp';d.textContent=g;pills.appendChild(d);});

  // Featured badge from config
  const ft=p.cfg?.featured_badge_type;
  if(ft&&FEAT_BADGE[ft]){
    const fc=FEAT_BADGE[ft];
    document.getElementById('fbadge').innerHTML=`<div class="fbadge ${fc.cls}">${fc.icon?fc.icon+' ':''}<span>${fc.label}</span></div>`;
    document.getElementById('fbadge-wrap').style.display='block';
  }

  // Stats: Followers · Gigs · Rating · Years active
  const yr=p.created_at?Math.max(1,new Date().getFullYear()-new Date(p.created_at).getFullYear()):1;
  const avg=p.reviews?.length?(p.reviews.reduce((s,r)=>s+(r.overall||0),0)/p.reviews.length).toFixed(1):'—';
  document.getElementById('sf').textContent=fmt(p.followers||0);
  document.getElementById('sg').textContent=p.gigCount||0;
  document.getElementById('sr').textContent=avg;
  document.getElementById('sy').textContent=yr;

  // Build sections — render in section_order, then always-on sections after
  const order=p.cfg?.section_order||['bio','links','media','gigs','reviews'];
  const featuredLinks=new Set((p.cfg?.featured_link_ids||[]).map(String));
  const container=document.getElementById('sections');

  function sec(id,title,inner,opts={}){
    if(!inner)return;
    const wrap=document.createElement('div');wrap.className='sec';wrap.id=id;
    const p2=document.createElement('div');p2.className='si2';
    p2.innerHTML=`<div class="sh"><div class="st">${title}</div>${opts.count?`<span style="font-size:11px;color:var(--muted)">${opts.count}</span>`:''}</div>`;
    p2.appendChild(inner);wrap.appendChild(p2);container.appendChild(wrap);
  }

  function buildBio(){
    const bio=p.bio_full||p.bio_short;
    if(!bio)return;
    const d=document.createElement('div');d.className='abt';d.textContent=bio;sec('sa','About',d);
  }
  function buildLinks(){
    if(!p.links?.length)return;
    const d=document.createElement('div');d.className='lkl';
    p.links.forEach(lk=>{
      const cfg2=PL[lk.platform?.toLowerCase()]||PL.website;
      const isFeat=featuredLinks.has(String(lk.id));
      const e=document.createElement('a');e.className=`lk${isFeat?' feat':''}`;
      e.href=lk.url||'#';e.target='_blank';e.rel='noopener';
      e.innerHTML=`<div class="lic" style="background:${cfg2.bg};color:${cfg2.c}">${cfg2.l[0]}</div><div class="lt"><div class="ln">${esc(lk.label||cfg2.l)}</div><div class="lh">${esc(lk.url||'')}</div></div><div class="lar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M7 7h10v10"/></svg></div>`;
      d.appendChild(e);
    });
    sec('slk','Find Me',d);
  }
  function buildMedia(){
    let vids=p.video_embeds||[];
    if(typeof vids==='string'){try{vids=JSON.parse(vids);}catch{vids=[];}}
    if(!Array.isArray(vids))vids=[];
    if(!vids.length)return;
    const d=document.createElement('div');d.className='mgd';
    vids.slice(0,4).forEach(v=>{
      const e=document.createElement('div');e.className='mc';
      if(v.thumbnail_url){
        e.innerHTML=`<img src="${esc(v.thumbnail_url)}" alt="" loading="lazy"><div class="mc-play"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.52)"/><polygon points="9,7 19,12 9,17" fill="white"/></svg></div>`;
        e.onclick=()=>v.url&&window.open(v.url,'_blank');
      }else{
        e.innerHTML='<div class="mc-empty">▶</div>';
        if(v.url)e.onclick=()=>window.open(v.url,'_blank');
      }
      d.appendChild(e);
    });
    sec('smd','Media',d);
  }
  function buildGigs(){
    if(!p.bookings?.length)return;
    const d=document.createElement('div');d.className='gigs-list';
    p.bookings.forEach(b=>{
      const gig=p.gigDetails[b.gig_id]||{},org=p.orgDetails[b.org_id]||{};
      const dt=gig.event_date?new Date(gig.event_date):null;
      const day=dt?dt.getDate():'—',mon=dt?dt.toLocaleString('en-AU',{month:'short'}).toUpperCase():'';
      const isC=b.status==='completed';
      const e=document.createElement('div');e.className='gig-row';
      e.innerHTML=`<div class="gig-date"><span class="gig-day">${day}</span><span class="gig-mon">${mon}</span></div><div class="gig-info"><div class="gig-title">${esc(gig.title||'Gig')}</div><div class="gig-venue">${esc(org.org_name||'')}${gig.location_city?` · ${esc(gig.location_city)}`:''}</div></div><span class="gig-badge ${isC?'done':'conf'}">${isC?'Verified':'Confirmed'}</span>`;
      d.appendChild(e);
    });
    sec('sgigs','Gig History',d);
  }
  function buildReviews(){
    if(!p.reviews?.length)return;
    const d=document.createElement('div');d.className='rev-list';
    p.reviews.forEach(rev=>{
      const stars=Array.from({length:5},(_,i)=>`<span class="rev-star${i<Math.round(rev.overall||0)?'':' off'}">★</span>`).join('');
      const dt=rev.submitted_at?new Date(rev.submitted_at).toLocaleDateString('en-AU',{month:'short',year:'numeric'}):'';
      const e=document.createElement('div');e.className='rev';
      e.innerHTML=`<div class="rev-top"><div class="rev-by">Verified Booking</div><div class="rev-stars">${stars}</div></div>${rev.comment?`<div class="rev-body">${esc(rev.comment)}</div>`:''}<div class="rev-date">${dt}</div>`;
      d.appendChild(e);
    });
    sec('srev','Reviews',d,{count:`${p.reviews.length} review${p.reviews.length!==1?'s':''}`});
  }

  function buildBadges(){
    if(!p.badges?.length)return;
    const d=document.createElement('div');d.className='bgr';
    [{t:'founding_artist',cls:'bpf',label:'Founding Artist',svg:`<svg viewBox="0 0 24 24" width="10" height="10"><path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z" fill="var(--gold)"/></svg>`},
     {t:'verified',cls:'bpv',label:'Verified',svg:`<svg viewBox="0 0 24 24" fill="none" width="10" height="10"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M8 12l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`},
     {t:'top_artist',cls:'bpc',label:'Top Artist',svg:`<svg viewBox="0 0 24 24" fill="none" width="10" height="10"><path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z" stroke="currentColor" stroke-width="1.5"/></svg>`},
    ].forEach(b=>{
      if(!p.badges.some(x=>x.badge_type===b.t))return;
      const e=document.createElement('div');e.className=`bp ${b.cls}`;
      e.innerHTML=`${b.svg}<span>${b.label}</span>`;d.appendChild(e);
    });
    if(d.children.length)sec('sbg','Badges',d);
  }
  function buildPress(){
    const quotes=p.cfg?.press_quotes||[];
    if(!quotes.length)return;
    const d=document.createElement('div');d.className='qtl';
    quotes.forEach(q=>{
      const e=document.createElement('div');e.className='qt';
      e.innerHTML=`<div class="qb">"${esc(q.quote||q.body||'')}"</div><div class="qs">${esc(q.source||q.publication||'')}</div>`;
      d.appendChild(e);
    });
    sec('sqt','Press',d);
  }
  function buildEPK(){
    if(!p.epk||!p.show_mini_epk)return;
    const epk=p.epk;
    const d=document.createElement('div');d.className='epk-grid';
    [{lbl:'Statement',val:epk.statement},{lbl:'Sound / Style',val:epk.genre_style},{lbl:'Performance history',val:epk.performance_history},{lbl:'Press',val:epk.press_features},{lbl:'Tech requirements',val:epk.tech_requirements},{lbl:'Booking contact',val:epk.booking_contact}]
    .forEach(r=>{
      if(!r.val)return;
      const row=document.createElement('div');row.className='epk-row';
      row.innerHTML=`<div class="epk-lbl">${esc(r.lbl)}</div><div class="epk-val">${esc(r.val)}</div>`;d.appendChild(row);
    });
    if(epk.sample_links?.length){
      const row=document.createElement('div');row.className='epk-row';
      row.innerHTML=`<div class="epk-lbl">Sample links</div><div class="epk-links">${epk.sample_links.map(l=>`<a class="epk-link" href="${esc(l)}" target="_blank" rel="noopener">${esc(l.replace(/^https?:\/\//,'').split('/')[0])}</a>`).join('')}</div>`;
      d.appendChild(row);
    }
    if(d.children.length)sec('sepk','Electronic Press Kit',d);
  }

  // Render in user-defined order
  const builders={bio:buildBio,links:buildLinks,media:buildMedia,gigs:buildGigs,reviews:buildReviews};
  order.forEach(key=>{if(builders[key])builders[key]();});
  // Always-visible sections (if not in order, still render)
  buildBadges();buildPress();buildEPK();

}


let fol=false;
function toggleFollow(){fol=!fol;const b=document.getElementById('bfl');b.textContent=fol?'Following':'Follow';b.className=`bfl${fol?' on':''}`;}
function doShare(){if(navigator.share)navigator.share({url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href);}

function demoData(){
  return{stage_name:'Alfred Jay',username:'alfredjay',bio_short:'Melbourne based DJ.',bio_full:'Melbourne based DJ and producer. Electronic and house sounds across venues and festivals. Available for bookings.',artist_type:['DJ'],genres:['Electronic','House','Techno'],verified:false,available:true,open_to_collab:true,live_now:false,location_city:'Melbourne, AU',photo_url:null,banner_url:null,followers:0,gigCount:0,reviews:[],bookings:[],gigDetails:{},orgDetails:{},links:[{id:'1',platform:'instagram',url:'https://instagram.com/setdrop.au',label:'@setdrop.au',sort_order:0}],badges:[{badge_type:'founding_artist'}],cfg:{featured_badge_type:'founding_artist',colour_scheme:'default',font_style:'dm_sans',section_order:['bio','links','media','gigs','reviews'],press_quotes:[{quote:'One of Melbourne\'s most exciting acts right now.',source:'Beat Magazine'}],featured_link_ids:['1'],spacing_style:'standard',separator_style:'line'},epk:null,show_mini_epk:false,video_embeds:[]};
}

(async()=>{
  const u=slug();
  if(u==='demo'){
    document.getElementById('ld').classList.add('gone');
    document.getElementById('prf').style.display='block';
    document.getElementById('abar').style.display='flex';
    render(demoData());return;
  }
  try{
    const p=await load(u);
    document.getElementById('ld').classList.add('gone');
    if(!p){document.getElementById('nf').style.display='flex';return;}
    document.getElementById('prf').style.display='block';
    document.getElementById('abar').style.display='flex';
    render(p);
  }catch(err){
    console.error(err);
    document.getElementById('ld').querySelector('.ldm').textContent='Could not load profile';
    document.getElementById('ld').querySelector('.spin').style.display='none';
  }
})();
</script>
