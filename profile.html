<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Setdrop</title>
<meta name="theme-color" content="#09090F">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090F;--cyan:#00D2FF;--white:#F0F0FF;--muted:#888AAA;--dim:#3A3A5A;
  --green:#1D9E75;--red:#C0392B;--gold:#D4A017;
  --glass:rgba(9,9,15,0.62);--gb:rgba(255,255,255,0.09);--r:14px;--max:480px;
  --font:"DM Sans",system-ui,sans-serif;--sp:10px;--ip:16px
}
html{background-color:var(--base,#06090E);background-image:linear-gradient(rgba(0,210,255,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,210,255,.055) 1px,transparent 1px),linear-gradient(rgba(0,210,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(0,210,255,.022) 1px,transparent 1px);background-size:80px 80px,80px 80px,20px 20px,20px 20px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;font-family:var(--font);color:var(--white);overflow-x:hidden;background-color:var(--base,#06080F);background-image:linear-gradient(rgba(0,130,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,130,255,.04) 1px,transparent 1px);background-size:40px 40px}

/* BACKGROUND — independent fixed layers, no wrapper */
#bgi{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max);z-index:0;background-size:cover;background-position:center top;opacity:0;transition:opacity 1.1s ease;pointer-events:none;will-change:transform}
#bgi.on{opacity:.78;filter:brightness(.88)}
#bgg{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max);z-index:1;background:linear-gradient(to bottom,rgba(6,9,14,.15) 0%,rgba(6,9,14,.45) 25%,rgba(6,9,14,.82) 55%,rgba(6,9,14,.97) 80%,rgba(6,9,14,1) 100%);pointer-events:none}

/* LOADING */
#ld{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:12px;transition:opacity .4s}
#ld.gone{opacity:0;pointer-events:none}
.brand{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:700;letter-spacing:-.4px}
.brand img{display:block;flex-shrink:0}
.brand .w{color:var(--white)}.brand .d{color:var(--cyan)}
.spin{width:20px;height:20px;border:2px solid rgba(0,210,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldm{font-size:12px;color:var(--muted)}

/* STATUS pill — fixed top-left */
#spp{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:100;
  display:none;align-items:center;gap:5px;
  background:rgba(5,5,8,.85);border:.5px solid rgba(255,255,255,.14);
  border-radius:20px;padding:4px 10px 4px 8px;font-size:10px;font-weight:500;color:var(--muted);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.spdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.spdot.live{background:var(--red);animation:pd 1.4s ease-in-out infinite}
.spdot.avail{background:var(--green)}
@keyframes pd{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.5);opacity:1}}

/* NAVBAR */
#nav{position:fixed;top:0;left:0;right:0;z-index:90;
  background:rgba(9,9,15,.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.07);
  padding:0 16px;padding-top:env(safe-area-inset-top);
  height:calc(52px + env(safe-area-inset-top));
  display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
#nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;padding-bottom:10px}
.nav-brand{display:flex;align-items:center;gap:4px;font-size:18px;font-weight:700;letter-spacing:-.4px;text-decoration:none}
.nav-brand img{display:block;flex-shrink:0}
.nav-brand .w{color:var(--white)}.nav-brand .d{color:var(--cyan)}
.nav-btns{display:flex;align-items:center;gap:6px}
.nbtn{font-size:12px;font-weight:600;padding:6px 13px;border-radius:8px;cursor:pointer;border:none;font-family:inherit;transition:all .15s;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.nbtn.ghost{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:var(--white)}
.nbtn.ghost:hover{background:rgba(255,255,255,.12)}
.nbtn.primary{background:var(--cyan);color:var(--bg)}
.nbtn.primary:hover{opacity:.9}
.nbtn.danger{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);color:var(--muted)}
.nav-owner{display:none;align-items:center;gap:6px}

/* LAYOUT */
#scroll-stage{position:fixed;top:calc(52px + env(safe-area-inset-top));bottom:var(--abar-h,0px);left:0;right:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;z-index:3}
#pg{position:relative;z-index:2;max-width:var(--max);margin:0 auto;
  padding-top:0;padding-bottom:20px}

/* HERO */
.hero{padding:calc(max(68px,env(safe-area-inset-top)) + 20px) 20px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero.classic{align-items:flex-start;text-align:left}
.hero.classic .avpills,.hero.classic .pills{justify-content:flex-start}
.avw{position:relative;margin-bottom:12px}
.av{width:80px;height:80px;border-radius:50%;border:2px solid var(--cyan);background:rgba(0,210,255,.1);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:var(--cyan);transition:border-radius .3s}
.av.sq{border-radius:16px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.vbdg{position:absolute;bottom:-1px;right:-1px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--bg);align-items:center;justify-content:center;display:none}
.nm{font-size:22px;font-weight:700;letter-spacing:-.4px;line-height:1.15;margin-bottom:3px;text-shadow:0 1px 14px rgba(0,0,0,.95),0 2px 6px rgba(0,0,0,.85),0 0 40px rgba(0,0,0,.7)}
.hnd{font-size:11px;color:var(--muted);margin-bottom:5px;text-shadow:0 1px 8px rgba(0,0,0,.95),0 0 24px rgba(0,0,0,.8)}
/* Light background text readability */
body.light-bg .nm{color:#111;text-shadow:0 1px 3px rgba(255,255,255,.3)}
body.light-bg .hnd,body.light-bg .loc{color:#444;text-shadow:none}
body.light-bg .st{color:#444}
body.light-bg .abt{color:#222}
body.light-bg .sv{color:#111}
body.light-bg .sl{color:#555}
body.light-bg .gp{color:#0077aa;border-color:rgba(0,120,170,.4);background:rgba(0,120,170,.08)}
/* Vignette */
#vignette{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse 110% 90% at 50% 50%,transparent 38%,rgba(0,0,0,.72) 100%)}
.loc{font-size:11px;color:var(--muted);margin-bottom:7px;display:none}

/* availability pills */
.avpills{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:7px}
.avp{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:4px 10px;font-size:10px;font-weight:600;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.avp-book{background:rgba(29,158,117,.1);border:1px solid rgba(29,158,117,.28);color:var(--green)}
.avp-collab{background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.22);color:var(--cyan)}
.avp-live{background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.3);color:#E74C3C}
.avdot{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.avdot.pulse{animation:pd 1.4s ease-in-out infinite}

/* type/genre pills */
.pills{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.gp{font-size:10px;font-weight:500;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:3px 9px;color:rgba(240,240,255,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.tp{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.18);color:var(--white);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
/* Accent scoping — avatar border, stat numbers, section titles, stage name, pills */
#pg .av{border-color:var(--accent,var(--cyan))}
#pg .sv{color:var(--accent,var(--cyan))}
#pg .nm{color:var(--accent,var(--white))}
#pg .st{color:var(--accent,var(--muted))}
#pg .gp{color:var(--accent,rgba(240,240,255,.8));border-color:var(--accent,rgba(255,255,255,.15))}
#pg .tp{color:var(--accent,var(--white));border-color:var(--accent,rgba(255,255,255,.18))}
#fbadge-wrap{margin-top:8px;display:none}
.fbadge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700}
.fbadge.founding{background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.3);color:var(--gold)}
.fbadge.verified{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--white)}
.fbadge.collab{background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.22);color:var(--green)}
.fbadge.top{background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.22);color:var(--cyan)}
.fbadge.gold{background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.3);color:var(--gold)}

/* STATS — always matches section appearance */
.stats{display:flex;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:var(--glass);border:1px solid var(--gb);border-radius:var(--r);margin:var(--sp) 14px 0;overflow:hidden;transition:all .3s}
.stats.style-line{background:transparent;border:none;border-top:1px solid var(--gb);border-radius:0;margin:var(--sp) 0 0}
/* line section style */
body.sec-line .sec{background:transparent!important;border:none!important;border-top:1px solid rgba(255,255,255,.1)!important}
/* col shadow */
#col-shadow{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:var(--max);z-index:0;pointer-events:none;box-shadow:0 0 100px 30px rgba(0,0,0,.65),inset 0 0 0 1px var(--gb,rgba(255,255,255,.09))}
/* Edge glow — CSS inner glow around entire profile column */
#edge-glow{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max);z-index:10;pointer-events:none}
#edge-glow.fx-fire{animation:efx-fire 1.7s ease-in-out infinite}
#edge-glow.fx-laser{animation:efx-laser 2.4s linear infinite}
#edge-glow.fx-pulse{animation:efx-pulse 1.9s ease-in-out infinite}
/* Rain — two layers: full background + column-confined, clipped between navbars */
#rain-bg-canvas{position:fixed;top:calc(52px + env(safe-area-inset-top));left:0;width:100%;height:calc(100vh - 52px - env(safe-area-inset-top) - var(--abar-h,0px));z-index:1;pointer-events:none;display:none}
#rain-canvas{position:fixed;top:calc(52px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:100%;max-width:var(--max);height:calc(100vh - 52px - env(safe-area-inset-top) - var(--abar-h,0px));z-index:9;pointer-events:none;display:none}
@keyframes efx-fire{0%,100%{box-shadow:inset 0 0 10px 2px rgba(255,65,0,.45),inset 0 0 20px 1px rgba(255,120,0,.18)}50%{box-shadow:inset 0 0 16px 4px rgba(255,85,0,.58),inset 0 0 28px 2px rgba(255,150,0,.26)}}
@keyframes efx-laser{0%,100%{box-shadow:inset 0 0 8px 2px rgba(var(--gcr),var(--gcg),var(--gcb),.45),inset 0 60px 12px -20px rgba(var(--gcr),var(--gcg),var(--gcb),.3)}50%{box-shadow:inset 0 0 8px 2px rgba(var(--gcr),var(--gcg),var(--gcb),.45),inset 0 -60px 12px -20px rgba(var(--gcr),var(--gcg),var(--gcb),.3)}}
@keyframes efx-pulse{0%,100%{box-shadow:inset 0 0 6px 1px rgba(var(--gcr),var(--gcg),var(--gcb),.18)}50%{box-shadow:inset 0 0 14px 4px rgba(var(--gcr),var(--gcg),var(--gcb),.52)}}
/* BADGE GRID */
.badge-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.badge-card{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;font-size:11px;font-weight:600}
.badge-card .bi{font-size:14px;flex-shrink:0;width:18px;text-align:center;line-height:1}
.badge-card .bl{flex:1;font-size:11px;font-weight:600;line-height:1.2}
.si{flex:1;padding:13px 0;text-align:center;position:relative}
.si+.si::before{content:"";position:absolute;left:0;top:24%;bottom:24%;width:1px;background:var(--gb)}
.sv{font-size:18px;font-weight:700;letter-spacing:-.5px;line-height:1}
.sv.c{color:var(--cyan)}
.sl{font-size:9px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}

/* SECTIONS */
.sec{margin:var(--sp) 14px 0;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--gb);border-radius:var(--r);overflow:hidden}
.si2{padding:var(--ip)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.st{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:1.1px;text-transform:uppercase}

/* separator styles - no merging, sections always separate */
body.sep-none .sec+.sec{margin-top:4px}

/* ABOUT */
.abt{font-size:13px;color:#CCC;line-height:1.72}

/* EPK */
.epk-grid{display:flex;flex-direction:column;gap:12px}
.epk-row{display:flex;flex-direction:column;gap:3px}
.epk-lbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.epk-val{font-size:13px;color:#CCC;line-height:1.65}
.epk-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.epk-link{font-size:11px;color:var(--cyan);background:rgba(0,210,255,.06);border:1px solid rgba(0,210,255,.18);border-radius:6px;padding:3px 9px;text-decoration:none}

/* BADGES */
.bgr{display:flex;gap:5px;flex-wrap:wrap}
.bp{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600}
.bpf{background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.28);color:var(--gold)}
.bpv{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);color:var(--white)}
.bpc{background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.22);color:var(--cyan)}
.bpg{background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.2);color:var(--green)}
.bpp{background:rgba(150,100,220,.1);border:1px solid rgba(150,100,220,.25);color:#B67CE8}

/* LINKS */
.lkl{display:flex;flex-direction:column}
.lk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);text-decoration:none;-webkit-tap-highlight-color:transparent}
.lk:last-child{border-bottom:none}
.lic{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.lt{flex:1;min-width:0}
.ln{font-size:12px;font-weight:600;color:var(--white)}
.lh{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lar svg{width:13px;height:13px;stroke:var(--dim)}
.lk.feat .ln{color:var(--white)}
.lk.feat .lic{box-shadow:0 0 0 1px rgba(255,255,255,.18)}

/* PRESS */
.qtl{display:flex;flex-direction:column;gap:14px}
.qt{padding-left:12px;border-left:2px solid var(--qt-line,rgba(0,210,255,.35))}
.qb{font-size:13px;font-style:italic;color:#CCC;line-height:1.65}
.qs{font-size:10px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.5px}

/* GIGS */
.gigs-list{display:flex;flex-direction:column}
.gig-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.gig-row:last-child{border-bottom:none}
.gig-date{min-width:40px;text-align:center;line-height:1.2}
.gig-day{font-size:15px;font-weight:700;letter-spacing:-.3px;display:block}
.gig-mon{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.gig-info{flex:1;min-width:0}
.gig-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig-venue{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig-badge{font-size:9px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.gig-badge.done{background:rgba(29,158,117,.1);border:1px solid rgba(29,158,117,.2);color:var(--green)}
.gig-badge.conf{background:rgba(0,210,255,.07);border:1px solid rgba(0,210,255,.17);color:var(--cyan)}

/* MEDIA */
.mgd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:3px}
.mc{aspect-ratio:1;border-radius:8px;background:rgba(255,255,255,.04);border:1px solid var(--gb);overflow:hidden;position:relative;cursor:pointer}
.mc img{width:100%;height:100%;object-fit:cover;display:block}
.mc-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mc-play svg{width:30px;height:30px}
.mc-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--dim)}

/* REVIEWS */
.rev-list{display:flex;flex-direction:column}
.rev{padding:11px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.rev:last-child{border-bottom:none}
.rev-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.rev-by{font-size:12px;font-weight:600}
.rev-stars{display:flex;gap:2px}
.rev-star{font-size:11px;color:var(--gold)}.rev-star.off{color:var(--dim)}
.rev-body{font-size:12px;color:#CCC;line-height:1.62}
.rev-date{font-size:10px;color:var(--muted);margin-top:4px}

/* FOOTER */
.pft{text-align:center;padding:22px 0 18px;font-size:11px;color:var(--dim)}
.pft a{color:var(--muted);text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pft a .d{color:var(--cyan)}
.pft a svg{width:12px;height:12px;stroke:var(--muted)}

/* NOT FOUND */
.nfs{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px;text-align:center;gap:12px}
.nfs h2{font-size:20px;font-weight:700;margin-top:8px}
.nfs p{font-size:14px;color:var(--muted)}
.nfs a{color:var(--cyan);text-decoration:none;font-size:13px;font-weight:500;margin-top:4px}

/* ACTION BAR */
.abar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max);padding:12px 14px max(12px,env(safe-area-inset-bottom));background:rgba(9,9,15,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--gb);display:none;gap:8px;z-index:50}
.bfl{flex:1;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--gb);background:rgba(255,255,255,.06);color:var(--white);font-family:inherit;transition:all .15s}
.bfl.on{color:var(--cyan);border-color:rgba(0,210,255,.3);background:rgba(0,210,255,.06)}
.bsh{width:46px;height:46px;flex-shrink:0;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bsh svg{width:16px;height:16px;stroke:var(--muted)}

/* COLOUR SCHEMES */
body.scheme-warm{--cyan:#FF9F43;--green:#26de81}
body.scheme-cool{--cyan:#74b9ff;--green:#00cec9}
body.scheme-dark{--glass:rgba(0,0,0,.78)}
body.scheme-mono{--cyan:var(--white);--gold:var(--white)}

/* COMPACT / SPACIOUS */
body.spacing-compact{--sp:6px;--ip:12px}
body.spacing-spacious{--sp:16px;--ip:22px}
</style>
</head>
<body>

<div id="bgi"></div>
<div id="bgg"></div>
<div id="spp"><div class="spdot" id="spd"></div><span id="spl"></span></div>

<!-- NAVBAR -->
<div id="nav">

// ── AUTH ──────────────────────────────────────────────────────────────────────
async function getSession(){
  try{
    const r=await fetch(`${SB}/auth/v1/user`,{headers:{...H,Authorization:`Bearer ${localStorage.getItem("sb_at")||""}`}});
    if(!r.ok)return null;
    return await r.json();
  }catch{return null;}
}
async function initAuth(){
  // Handle magic link redirect
  const hash=new URLSearchParams(window.location.hash.replace("#",""));
  const at=hash.get("access_token");
  if(at){
    localStorage.setItem("sb_at",at);
    window.history.replaceState({},"",window.location.pathname);
  }
  const token=localStorage.getItem("sb_at");
  if(!token)return null;
  try{
    const r=await fetch(`${SB}/auth/v1/user`,{headers:{...H,Authorization:`Bearer ${token}`}});
    if(!r.ok){localStorage.removeItem("sb_at");return null;}
    SESSION=await r.json();
    return SESSION;
  }catch{return null;}
}
function showLogin(){document.getElementById("login-modal").style.display="flex";}
function closeLogin(){document.getElementById("login-modal").style.display="none";}
async function doLogin(){
  const email=document.getElementById("login-email").value.trim();
  const password=document.getElementById("login-password").value;
  if(!email||!password)return;
  const btn=document.getElementById("login-btn");
  const msg=document.getElementById("login-msg");
  btn.disabled=true;btn.textContent="Signing in...";
  try{
    const r=await fetch(`${SB}/auth/v1/token?grant_type=password`,{
      method:"POST",headers:{...H,"Content-Type":"application/json"},
      body:JSON.stringify({email,password})
    });
    const data=await r.json();
    if(r.ok&&data.access_token){
      localStorage.setItem("sb_at",data.access_token);
      SESSION=data.user||null;
      closeLogin();
      updateNavForAuth(SESSION,PROFILE_ID);
    }else{
      btn.disabled=false;btn.textContent="Sign in";
      msg.textContent=data.error_description||data.msg||"Incorrect email or password.";
      msg.style.color="rgba(255,100,100,.9)";msg.style.display="block";
    }
  }catch{btn.disabled=false;btn.textContent="Sign in";msg.textContent="Something went wrong. Try again.";msg.style.display="block";}
}
async function doSignOut(){
  localStorage.removeItem("sb_at");
  SESSION=null;
  updateNavForAuth(null);
  document.getElementById("owner-panel").style.display="none";
}
function updateNavForAuth(user,profileUserId){
  const pub=document.getElementById("nav-public");

  if(!user){pub.style.display="flex";own.style.display="none";return;}

  if(profileUserId&&user.id===profileUserId){
    own.style.display="flex";
  }else{
    own.style.display="none";
  }
}

// ── DATA LOADING ──────────────────────────────────────────────────────────────
async function load(u){
  const r=await fetch(`${SB}/rest/v1/artist_profiles?username=eq.${encodeURIComponent(u)}&select=*&limit=1`,{headers:H});
  if(!r.ok)return null;
  const rows=await r.json();if(!rows.length)return null;
  const p=rows[0];
  const[links,badges,cfgRows,epkRows,followers,gigCount,reviews,bookings]=await Promise.all([
    fetch(`${SB}/rest/v1/artist_links?artist_id=eq.${p.id}&order=sort_order.asc`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/artist_badges?artist_id=eq.${p.id}`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/artist_profile_config?artist_id=eq.${p.id}`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/artist_epk?artist_id=eq.${p.id}&limit=1`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/follows?following_id=eq.${p.id}&select=id`,{headers:{...H,Prefer:"count=exact",Range:"0-0"}}).then(r=>{const h=r.headers.get("content-range");return h?parseInt(h.split("/")[1])||0:0;}).catch(()=>0),
    fetch(`${SB}/rest/v1/bookings?artist_id=eq.${p.id}&status=eq.completed&select=id`,{headers:{...H,Prefer:"count=exact",Range:"0-0"}}).then(r=>{const h=r.headers.get("content-range");return h?parseInt(h.split("/")[1])||0:0;}).catch(()=>0),
    fetch(`${SB}/rest/v1/reviews?reviewee_id=eq.${p.id}&select=overall,comment,submitted_at&order=submitted_at.desc&limit=5`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/bookings?artist_id=eq.${p.id}&select=id,status,gig_id,org_id&order=created_at.desc&limit=8`,{headers:H}).then(r=>r.ok?r.json():[]),
  ]);
  const cfg=cfgRows[0]||null;const epk=epkRows[0]||null;
  let gigDetails={},orgDetails={};
  if(bookings.length){
    const gids=[...new Set(bookings.map(b=>b.gig_id).filter(Boolean))];
    const oids=[...new Set(bookings.map(b=>b.org_id).filter(Boolean))];
    const[gr,or]=await Promise.all([
      gids.length?fetch(`${SB}/rest/v1/gig_postings?id=in.(${gids.map(i=>`"${i}"`).join(",")})&select=id,title,event_date,location_city`,{headers:H}).then(r=>r.ok?r.json():[]):Promise.resolve([]),
      oids.length?fetch(`${SB}/rest/v1/org_profiles?id=in.(${oids.map(i=>`"${i}"`).join(",")})&select=id,org_name`,{headers:H}).then(r=>r.ok?r.json():[]):Promise.resolve([]),
    ]);
    gigDetails=Object.fromEntries(gr.map(g=>[g.id,g]));
    orgDetails=Object.fromEntries(or.map(o=>[o.id,o]));
  }
  PROFILE_ID=p.user_id;

  // Fetch gallery photos from artist-gallery storage bucket
  let galleryPhotos=[];
  if(p.user_id){
    try{
      const gr=await fetch(`${SB}/storage/v1/object/list/artist-gallery`,{
        method:"POST",
        headers:{...H,"Content-Type":"application/json"},
        body:JSON.stringify({prefix:`${p.user_id}/`,limit:20,sortBy:{column:"created_at",order:"desc"}})
      });
      if(gr.ok){
        const files=await gr.json();
        galleryPhotos=(files||[])
          .filter(f=>f.name&&!f.name.endsWith("/"))
          .map(f=>`${SB}/storage/v1/object/public/artist-gallery/${p.user_id}/${f.name}`);
      }
    }catch(e){console.warn("gallery fetch failed",e);}
  }

  return{...p,links,badges,cfg,epk,followers,gigCount,reviews,bookings,gigDetails,orgDetails,galleryPhotos};
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function applyCustomisation(cfg){
  if(!cfg)return;
  const font=FONTS[cfg.font_style];
  if(font){document.documentElement.style.setProperty("--font",font);document.body.style.fontFamily=font;}
  if(cfg.colour_scheme&&cfg.colour_scheme!=="default")document.body.classList.add(`scheme-${cfg.colour_scheme}`);
  if(cfg.spacing_style&&cfg.spacing_style!=="standard")document.body.classList.add(`spacing-${cfg.spacing_style}`);
}

function hexLuminance(hex){
  const c=(hex||"").replace("#","");
  if(c.length<6)return 0;
  const r=parseInt(c.slice(0,2),16)/255,g=parseInt(c.slice(2,4),16)/255,b=parseInt(c.slice(4,6),16)/255;
  return 0.299*r+0.587*g+0.114*b;
}
function applyProfileCustomisation(p){
  const ap=p; // artist_profiles row
  const cfg=p.cfg||{};
  // Accent colour — only set --accent, never --cyan (to keep text colors neutral)
  const accent=ap.accent_colour||"#00D2FF";
  const pgEl=document.getElementById("pg");
  document.documentElement.style.setProperty("--accent",accent);
  if(pgEl){pgEl.style.setProperty("--accent",accent);}
  // Press quote border — accent at lower opacity for a subtler bar
  {const r=parseInt(accent.slice(1,3),16),g=parseInt(accent.slice(3,5),16),b=parseInt(accent.slice(5,7),16);
  document.documentElement.style.setProperty("--qt-line","rgba("+r+","+g+","+b+",.38)");}
  // Base/background colour
  const base=ap.base_colour||"#09090F";
  document.documentElement.style.setProperty("--base",base);
  // Cover mode: hero (default) fades quickly; full keeps image visible throughout
  const coverMode=cfg.cover_mode||"hero";
  if(coverMode==="full"){
    document.getElementById("bgg").style.background=`rgba(0,0,0,.38)`;
  } else {
    document.getElementById("bgg").style.background=`linear-gradient(to bottom,${base}33 0%,${base}88 42%,${base}EE 68%,${base}FF 100%)`;
  }
  // Corner radius — change CSS variable so all .sec elements pick it up
  const cRadius=ap.corner_radius||"rounded";
  const crMap={rounded:"14px",sharp:"4px",flat:"0px"};
  document.documentElement.style.setProperty("--r",crMap[cRadius]||"14px");
  // Section style — update CSS vars so .sec and .stats both react
  const sStyle=ap.section_style||"glass";
  const glassMap={glass:"rgba(9,9,15,0.62)",ghost:"rgba(9,9,15,0.04)",solid:"rgba(9,9,15,.96)",line:"rgba(9,9,15,0.02)"};
  const gbMap={glass:"rgba(255,255,255,0.09)",ghost:"rgba(255,255,255,0.04)",solid:"rgba(255,255,255,0.04)",line:"rgba(255,255,255,0.1)"};
  const gbVal=gbMap[sStyle]||gbMap.glass;
  if(pgEl){
    pgEl.style.setProperty("--glass",glassMap[sStyle]||glassMap.glass);
    pgEl.style.setProperty("--gb",gbVal);
  }
  // Also set on root so fixed elements like #col-shadow can use it
  document.documentElement.style.setProperty("--gb",gbVal);
  document.body.classList.toggle("sec-line",sStyle==="line");
  // Stats bar
  const statsEl=document.getElementById("stats");
  if(statsEl)statsEl.className=`stats style-${sStyle}`;
  // Avatar shape
  const avEl=document.getElementById("av");
  if(avEl)avEl.classList.toggle("sq",ap.avatar_shape==="square");
  // Header layout
  const heroEl=document.querySelector(".hero");
  if(heroEl)heroEl.classList.toggle("classic",ap.header_layout==="classic");
  // Text readability on light backgrounds
  document.body.classList.toggle("light-bg",hexLuminance(base)>0.45);
  // Edge effects
  const edge=cfg.edge_effect||"none";
  renderEdgeEffects(edge,accent);
  // Background texture
  const texture=cfg.bg_texture||"clean";
  if(texture&&texture!=="clean")renderBgTexture(texture);
}

let _rainAF=null;
function _makeDrops(count,w,h,opMin,opMax){
  const d=[];
  for(let i=0;i<count;i++)d.push({x:Math.random()*(w+80)-40,y:Math.random()*h,vy:5+Math.random()*6,vx:.5+Math.random()*.7,len:12+Math.random()*28,op:opMin+Math.random()*(opMax-opMin),lw:Math.random()<.28?1.2:.65});
  return d;
}
function _animDrops(ctx,drops,ri,gi,bi,w,h){
  ctx.clearRect(0,0,w,h);
  drops.forEach(d=>{
    const x0=d.x-d.vx*(d.len/d.vy),y0=d.y-d.len;
    const gr=ctx.createLinearGradient(x0,y0,d.x,d.y);
    gr.addColorStop(0,"rgba("+ri+","+gi+","+bi+",0)");
    gr.addColorStop(1,"rgba("+ri+","+gi+","+bi+","+d.op+")");
    ctx.strokeStyle=gr;ctx.lineWidth=d.lw;
    ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(d.x,d.y);ctx.stroke();
    d.x+=d.vx;d.y+=d.vy;
    if(d.y-d.len>h){d.x=Math.random()*(w+80)-40;d.y=-d.len-Math.random()*120;d.vy=5+Math.random()*6;d.len=12+Math.random()*28;}
  });
}
function renderEdgeEffects(type,accent){
  const g=document.getElementById("edge-glow");
  const rc=document.getElementById("rain-canvas");
  const rb=document.getElementById("rain-bg-canvas");
  if(_rainAF){cancelAnimationFrame(_rainAF);_rainAF=null;}
  [rc,rb].forEach(c=>{if(c){c.style.display="none";c.getContext("2d").clearRect(0,0,c.width,c.height);}});
  if(!g)return;
  g.className="";
  if(!type||type==="none")return;
  if(type==="rain"){
    // Background layer — full content area (below nav, above abar)
    const stage=document.getElementById("scroll-stage");
    const bw=window.innerWidth,bh=stage?stage.clientHeight:window.innerHeight;
    rb.style.display="block";rb.width=bw;rb.height=bh;
    const bDrops=_makeDrops(Math.round(bw/12),bw,bh,.03,.1);
    const bCtx=rb.getContext("2d");
    // Column layer — accent colour, higher opacity
    rc.style.display="block";
    const cw=rc.offsetWidth||Math.min(window.innerWidth,480);
    rc.width=cw;rc.height=bh;
    const ri=parseInt(accent.slice(1,3),16),gi=parseInt(accent.slice(3,5),16),bi=parseInt(accent.slice(5,7),16);
    const cDrops=_makeDrops(120,cw,bh,.18,.55);
    const cCtx=rc.getContext("2d");
    (function frame(){
      _animDrops(bCtx,bDrops,240,240,255,bw,bh);
      _animDrops(cCtx,cDrops,ri,gi,bi,cw,bh);
      _rainAF=requestAnimationFrame(frame);
    })();
    return;
  }
  if(type!=="fire"){
    const r=parseInt(accent.slice(1,3),16),gv=parseInt(accent.slice(3,5),16),b=parseInt(accent.slice(5,7),16);
    g.style.setProperty("--gcr",r);g.style.setProperty("--gcg",gv);g.style.setProperty("--gcb",b);
  }
  g.className="fx-"+type;
}

function renderBgTexture(type){
  let c=document.getElementById("bg-texture-canvas");
  if(!c){
    c=document.createElement("canvas");c.id="bg-texture-canvas";
    c.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2;opacity:0.18;";
    document.getElementById("bgi").insertAdjacentElement("afterend",c);
  }
  const w=window.innerWidth,h=window.innerHeight;
  c.width=w;c.height=h;
  const ctx=c.getContext("2d");
  ctx.clearRect(0,0,w,h);
  ctx.strokeStyle="rgba(255,255,255,1)";ctx.lineWidth=0.6;
  if(type==="scanline"){for(let y=0;y<h;y+=3){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}}
  else if(type==="dots"){for(let x=0;x<w;x+=9)for(let y=0;y<h;y+=9){ctx.beginPath();ctx.arc(x,y,0.7,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,1)";ctx.fill();}}
  else if(type==="diagonal"){for(let i=-h;i<w+h;i+=12){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+h,h);ctx.stroke();}}
  else if(type==="hex"){const s=14;for(let row=0;row<h/s/1.5+1;row++)for(let col=0;col<w/s/1.73+1;col++){const x=col*s*1.73+(row%2)*s*0.87,y=row*s*1.5;ctx.beginPath();for(let i=0;i<6;i++)ctx.lineTo(x+s*Math.cos(Math.PI/3*i),y+s*Math.sin(Math.PI/3*i));ctx.closePath();ctx.stroke();}}
  else if(type==="noise"){for(let i=0;i<Math.floor(w*h*0.003);i++){ctx.fillStyle="rgba(255,255,255,"+(Math.random()*0.9)+")";ctx.fillRect(Math.random()*w,Math.random()*h,1,1);}}
  else if(type==="rain"){for(let i=0;i<200;i++){const x=Math.random()*w,y=Math.random()*h,l=Math.random()*14+5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+1,y+l);ctx.stroke();}}
}

function render(p){
  document.title=`${p.stage_name} (@${p.username}) · Setdrop`;
  applyCustomisation(p.cfg);
  applyProfileCustomisation(p);

  // Background — video takes priority, then image
  if(p.cfg?.cover_type==="video"&&p.cfg?.cover_video_url){
    let vid=document.getElementById("bgi-vid");
    if(!vid){
      vid=document.createElement("video");
      vid.id="bgi-vid";
      vid.setAttribute("autoplay","");vid.setAttribute("muted","");vid.setAttribute("loop","");vid.setAttribute("playsinline","");vid.setAttribute("webkit-playsinline","");
      vid.muted=true; // also set property for JS-side muting
      vid.style.cssText="position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max);height:100%;object-fit:cover;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.1s ease";
      document.getElementById("bgi").insertAdjacentElement("afterend",vid);
    }
    vid.src=p.cfg.cover_video_url;
    vid.load();
    const _vidShow=()=>{vid.style.opacity="0.78";};
    // Play immediately — works on desktop + Android. iOS Safari needs explicit .play() call.
    const _tryPlay=()=>{
      const p2=vid.play();
      if(p2!==undefined)p2.then(_vidShow).catch(()=>{
        // Autoplay blocked — show on first user touch
        document.addEventListener("touchstart",()=>{vid.play().then(_vidShow).catch(()=>{});},{once:true,passive:true});
      });
      else _vidShow(); // older Safari returns undefined
    };
    if(vid.readyState>=2)_tryPlay();
    else vid.addEventListener("canplay",_tryPlay,{once:true});
  } else {
    const bgSrc=p.cfg?.cover_photo_url||p.banner_url||p.photo_url;
    if(bgSrc){
      const bgi=document.getElementById("bgi");
      bgi.style.backgroundImage=`url("${bgSrc}")`;
      requestAnimationFrame(()=>requestAnimationFrame(()=>bgi.classList.add("on")));
    }
  }

  // Avatar
  const av=document.getElementById("av");
  if(p.photo_url)av.innerHTML=`<img src="${esc(p.photo_url)}" alt="">`;
  else av.textContent=(p.stage_name||"?")[0].toUpperCase();
  if(p.verified)document.getElementById("vbdg").style.display="flex";

  document.getElementById("nm").textContent=p.stage_name||p.username;
  document.getElementById("hnd").textContent=`@${p.username}`;
  if(p.location_city){const l=document.getElementById("loc");l.textContent=p.location_city;l.style.display="block";}

  // Availability pills
  const avp=document.getElementById("avpills");
  if(p.live_now){avp.innerHTML+=`<div class="avp avp-live"><span class="avdot pulse"></span>Live Now</div>`;document.getElementById("spd").className="spdot live";document.getElementById("spl").textContent="Live Now";document.getElementById("spp").style.display="inline-flex";}
  if(p.available)avp.innerHTML+=`<div class="avp avp-book"><span class="avdot"></span>Available to Book</div>`;
  if(p.open_to_collab)avp.innerHTML+=`<div class="avp avp-collab"><span class="avdot"></span>Open to Collab</div>`;

  // Type + genre pills
  const pills=document.getElementById("pills");
  (p.artist_type||[]).forEach(t=>{const d=document.createElement("div");d.className="tp";d.textContent=t;pills.appendChild(d);});
  (p.genres||[]).forEach(g=>{const d=document.createElement("div");d.className="gp";d.textContent=g;pills.appendChild(d);});

  // Featured badge
  const ft=p.cfg?.featured_badge_type;
  if(ft&&FEAT_BADGE[ft]){const fc=FEAT_BADGE[ft];document.getElementById("fbadge").innerHTML=`<div class="fbadge ${fc.cls}">${fc.icon?fc.icon+" ":""}<span>${fc.label}</span></div>`;document.getElementById("fbadge-wrap").style.display="block";}

  // Stats
  const yr=p.created_at?Math.max(1,new Date().getFullYear()-new Date(p.created_at).getFullYear()):1;
  const avg=p.reviews?.length?(p.reviews.reduce((s,r)=>s+(r.overall||0),0)/p.reviews.length).toFixed(1):"—";
  document.getElementById("sf").textContent=fmt(p.followers||0);
  document.getElementById("sg").textContent=p.gigCount||0;
  document.getElementById("sr").textContent=avg;
  document.getElementById("sy").textContent=yr;

  // Section builders — keyed by the actual DB section_order values
  const container=document.getElementById("sections");
  const featuredLinks=new Set((p.cfg?.featured_link_ids||[]).map(String));

  function sec(id,title,inner,opts={}){
    if(!inner)return;
    const wrap=document.createElement("div");wrap.className="sec";wrap.id=id;
    const p2=document.createElement("div");p2.className="si2";
    p2.innerHTML=`<div class="sh"><div class="st">${title}</div>${opts.count?`<span style="font-size:11px;color:var(--muted)">${opts.count}</span>`:""}</div>`;
    p2.appendChild(inner);wrap.appendChild(p2);container.appendChild(wrap);
  }

  const builders={
    bio(){
      const bio=p.bio_full||p.bio_short;if(!bio)return;
      const d=document.createElement("div");d.className="abt";d.textContent=bio;sec("sa","About",d);
    },
    links(){
      if(!p.links?.length)return;
      const d=document.createElement("div");d.className="lkl";
      p.links.forEach(lk=>{
        const cfg2=PL[lk.platform?.toLowerCase()]||PL.website;
        const isFeat=featuredLinks.has(String(lk.id));
        const e=document.createElement("a");e.className=`lk${isFeat?" feat":""}`;
        e.href=lk.url?.startsWith("http")?lk.url:`https://${lk.url}`;
        e.target="_blank";e.rel="noopener";
        e.innerHTML=`<div class="lic" style="background:${cfg2.bg};color:${cfg2.c}">${cfg2.l[0]}</div><div class="lt"><div class="ln">${esc(lk.label||cfg2.l)}</div><div class="lh">${esc(lk.url||"")}</div></div><div class="lar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M7 7h10v10"/></svg></div>`;
        d.appendChild(e);
      });
      sec("slk","Links",d);
    },
    media(){
      let vids=p.video_embeds||[];
      if(typeof vids==="string"){try{vids=JSON.parse(vids);}catch{vids=[];}}
      if(!Array.isArray(vids))vids=[];
      const photos=p.galleryPhotos||[];
      if(!vids.length&&!photos.length)return;

      const d=document.createElement("div");d.className="mgd";

      // Photos first — direct from storage
      photos.slice(0,8).forEach(url=>{
        const e=document.createElement("div");e.className="mc";
        e.innerHTML=`<img src="${esc(url)}" alt="" loading="lazy">`;
        e.onclick=()=>window.open(url,"_blank");
        d.appendChild(e);
      });

      // Then video embeds
      vids.slice(0,4).forEach(v=>{
        const e=document.createElement("div");e.className="mc";
        if(v.thumbnail_url){
          e.innerHTML=`<img src="${esc(v.thumbnail_url)}" alt="" loading="lazy"><div class="mc-play"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.52)"/><polygon points="9,7 19,12 9,17" fill="white"/></svg></div>`;
          e.onclick=()=>(v.url&&window.open(v.url.startsWith("http")?v.url:`https://${v.url}`,"_blank"));
        }else{e.innerHTML="<div class=\"mc-empty\">▶</div>";}
        d.appendChild(e);
      });

      if(d.children.length)sec("smd","Media",d);
    },
    past_gigs(){
      if(!p.bookings?.length)return;
      const d=document.createElement("div");d.className="gigs-list";
      p.bookings.forEach(b=>{
        const gig=p.gigDetails[b.gig_id]||{},org=p.orgDetails[b.org_id]||{};
        const dt=gig.event_date?new Date(gig.event_date):null;
        const day=dt?dt.getDate():"—",mon=dt?dt.toLocaleString("en-AU",{month:"short"}).toUpperCase():"";
        const isC=b.status==="completed";
        const e=document.createElement("div");e.className="gig-row";
        e.innerHTML=`<div class="gig-date"><span class="gig-day">${day}</span><span class="gig-mon">${mon}</span></div><div class="gig-info"><div class="gig-title">${esc(gig.title||"Gig")}</div><div class="gig-venue">${esc(org.org_name||"")}${gig.location_city?` · ${esc(gig.location_city)}`:""}</div></div><span class="gig-badge ${isC?"done":"conf"}">${isC?"Verified":"Confirmed"}</span>`;
        d.appendChild(e);
      });
      sec("sgigs","Past Gigs",d);
    },
    press_quotes(){
      const quotes=p.cfg?.press_quotes||[];if(!quotes.length)return;
      const d=document.createElement("div");d.className="qtl";
      quotes.forEach(q=>{
        const e=document.createElement("div");e.className="qt";
        // Real DB uses {text, source} — fallback to {quote, body} for compatibility
        const body=q.text||q.quote||q.body||"";
        const src=q.source||q.publication||"";
        e.innerHTML=`<div class="qb">"${esc(body)}"</div><div class="qs">${esc(src)}</div>`;
        d.appendChild(e);
      });
      sec("sqt","Press",d);
    },
    badges(){
      if(!p.badges?.length)return;
      const sorted=p.badges
        .map(b=>({...b,m:BADGE_MAP[b.badge_type]}))
        .filter(b=>b.m)
        .sort((a,b)=>(a.m.pri??99)-(b.m.pri??99));
      const MAX=6;
      const show=sorted.slice(0,MAX);
      const extra=sorted.length-show.length;
      const d=document.createElement("div");d.className="badge-grid";
      show.forEach(b=>{
        const e=document.createElement("div");e.className=`badge-card ${b.m.cls}`;
        e.innerHTML=`<span class="bi">${b.m.icon||"◆"}</span><span class="bl">${esc(b.m.label)}</span>`;
        d.appendChild(e);
      });
      if(extra>0){
        const e=document.createElement("div");e.className="badge-card bpv";
        e.innerHTML=`<span class="bi">+${extra}</span><span class="bl">more</span>`;
        d.appendChild(e);
      }
      if(d.children.length)sec("sbg","Badges",d);
    },
    reviews(){
      if(!p.reviews?.length)return;
      const d=document.createElement("div");d.className="rev-list";
      p.reviews.forEach(rev=>{
        const stars=Array.from({length:5},(_,i)=>`<span class="rev-star${i<Math.round(rev.overall||0)?"":" off"}">★</span>`).join("");
        const dt=rev.submitted_at?new Date(rev.submitted_at).toLocaleDateString("en-AU",{month:"short",year:"numeric"}):"";
        const e=document.createElement("div");e.className="rev";
        e.innerHTML=`<div class="rev-top"><div class="rev-by">Verified Booking</div><div class="rev-stars">${stars}</div></div>${rev.comment?`<div class="rev-body">${esc(rev.comment)}</div>`:""}<div class="rev-date">${dt}</div>`;
        d.appendChild(e);
      });
      sec("srev","Reviews",d,{count:`${p.reviews.length} review${p.reviews.length!==1?"s":""}`});
    },
    contact(){
      const methods=p.cfg?.contact_methods;
      if(!methods?.length)return;
      const d=document.createElement("div");d.className="lkl";
      methods.forEach(m=>{
        const e=document.createElement("a");
        e.className="lk";
        const icons={phone:"📞",email:"✉️",website:"🔗",dm:"💬"};
        const labels={phone:"Call",email:"Email",website:"Website",dm:"Message"};
        let href=m.value||"";
        if(m.type==="phone"&&href)href="tel:"+href.replace(/\s/g,"");
        else if(m.type==="email"&&href)href="mailto:"+href;
        else if(!href.startsWith("http"))href="https://"+href;
        e.href=href;e.target="_blank";e.rel="noopener";
        e.innerHTML=`<div class="lic" style="background:rgba(0,210,255,.1);color:var(--cyan)">${icons[m.type]||"🔗"}</div><div class="lt"><div class="ln">${esc(labels[m.type]||m.type)}</div><div class="lh">${esc(m.value||"")}</div></div><div class="lar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M7 7h10v10"/></svg></div>`;
        d.appendChild(e);
      });
      sec("scontact","Contact",d);
    },
    // Groups — placeholder (no public data yet)
    groups(){},
    // EPK
    epk(){
      if(!p.epk||!p.show_mini_epk)return;
      const epk=p.epk;const d=document.createElement("div");d.className="epk-grid";
      [{lbl:"Statement",val:epk.statement},{lbl:"Sound / Style",val:epk.genre_style},{lbl:"Performance history",val:epk.performance_history},{lbl:"Press",val:epk.press_features},{lbl:"Tech requirements",val:epk.tech_requirements},{lbl:"Booking contact",val:epk.booking_contact}]
      .forEach(r=>{if(!r.val)return;const row=document.createElement("div");row.className="epk-row";row.innerHTML=`<div class="epk-lbl">${esc(r.lbl)}</div><div class="epk-val">${esc(r.val)}</div>`;d.appendChild(row);});
      if(epk.sample_links?.length){const row=document.createElement("div");row.className="epk-row";row.innerHTML=`<div class="epk-lbl">Sample links</div><div class="epk-links">${epk.sample_links.map(l=>`<a class="epk-link" href="${esc(l)}" target="_blank" rel="noopener">${esc(l.replace(/^https?:\/\//,"").split("/")[0])}</a>`).join("")}</div>`;d.appendChild(row);}
      if(d.children.length)sec("sepk","Electronic Press Kit",d);
    },
  };

  // Render in exact section_order, respecting hidden_sections
  const order=p.cfg?.section_order||["bio","links","media","past_gigs","press_quotes","badges","reviews","contact"];
  const hiddenSections=new Set(p.hidden_sections||[]);
  order.forEach(key=>{if(!hiddenSections.has(key)&&builders[key])builders[key]();});
}
