<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Setdrop</title>
<meta name="description" content="Artist profile on Setdrop">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090F;--cyan:#00D2FF;--white:#F0F0FF;--muted:#888AAA;--dim:#3A3A5A;
  --green:#1D9E75;--red:#A32D2D;--gold:#D4A017;
  --glass:rgba(9,9,15,0.6);--gb:rgba(255,255,255,0.09);--r:14px;--max:480px
}
html{background:var(--bg);-webkit-font-smoothing:antialiased}
body{min-height:100vh;font-family:'DM Sans',system-ui,sans-serif;color:var(--white);background:var(--bg);overflow-x:hidden}

/* FIXED BACKGROUND — uses banner_url (cover image), no movement */
#bg{position:fixed;inset:0;z-index:0}
#bgi{position:fixed;inset:0;background-size:cover;background-position:center top;opacity:0;transition:opacity 1s ease}
#bgi.on{opacity:1}
#bgg{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(9,9,15,.18) 0%,rgba(9,9,15,.42) 32%,rgba(9,9,15,.82) 62%,rgba(9,9,15,.98) 100%)}

/* LOADING */
#ld{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);gap:14px}
.brand{font-size:18px;font-weight:700}.brand .w{color:var(--white)}.brand .d{color:var(--cyan)}
.spin{width:20px;height:20px;border:2px solid rgba(0,210,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ldm{font-size:12px;color:var(--muted)}
#ld.gone{display:none}

/* STATUS — fixed top-left of viewport */
#spp{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:50;
  display:none;align-items:center;gap:5px;
  background:rgba(5,5,8,.78);border:.5px solid rgba(255,255,255,.12);
  border-radius:20px;padding:4px 10px 4px 8px;font-size:10px;font-weight:500;color:var(--muted);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.spdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.spdot.online{background:var(--green)}.spdot.offline{background:var(--muted)}
.spdot.live{background:var(--red);animation:pd 1.4s ease-in-out infinite}
.spdot.cast{background:var(--cyan);animation:pd 1.4s ease-in-out infinite}
@keyframes pd{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.4);opacity:1}}

#pg{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding-bottom:110px}

/* HERO */
.hero{padding:calc(max(52px,env(safe-area-inset-top)) + 20px) 20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center}
.avw{position:relative;margin-bottom:14px}
.av{width:78px;height:78px;border-radius:50%;border:2.5px solid var(--cyan);background:rgba(0,210,255,.1);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--cyan)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.vbdg{position:absolute;bottom:-2px;right:-2px;width:22px;height:22px;border-radius:50%;background:var(--bg);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.nm{font-size:23px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-bottom:4px;display:flex;align-items:center;gap:7px;justify-content:center;flex-wrap:wrap}
.hnd{font-size:12px;color:var(--muted);margin-bottom:8px}
.pills{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.gp{font-size:10px;font-weight:500;background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.25);color:var(--cyan);border-radius:20px;padding:3px 9px}
.tp{font-size:10px;font-weight:500;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);color:var(--muted);border-radius:20px;padding:3px 9px}
#fbadge-wrap{margin-top:10px}
.fbadge{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700}
.fbadge.founding{background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.3);color:var(--gold)}
.fbadge.verified{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:var(--white)}
.fbadge.collab{background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.22);color:var(--green)}
.fbadge.top{background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.22);color:var(--cyan)}

/* STATS: Followers · Gigs · Rating · Years */
.stats{display:flex;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--gb);border-bottom:1px solid var(--gb);margin-top:14px}
.si{flex:1;padding:14px 0;text-align:center;position:relative}
.si+.si::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:1px;background:var(--gb)}
.sv{font-size:19px;font-weight:700;letter-spacing:-.5px;line-height:1}
.sv.c{color:var(--cyan)}
.sl{font-size:9px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}

/* SECTIONS */
.sec{margin:10px 14px 0;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--gb);border-radius:var(--r);overflow:hidden}
.si2{padding:16px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.st{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.slnk{font-size:11px;color:var(--cyan);font-weight:500;text-decoration:none}
.abt{font-size:13px;color:#CCC;line-height:1.7}

/* TRACK */
.trk{padding:16px}
.tt{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pb{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:var(--cyan);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.pb svg{width:14px;height:14px;fill:var(--bg);margin-left:2px}
.ti{flex:1;min-width:0}
.tn{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:11px;color:var(--muted);margin-top:2px}
.wf{height:44px;display:flex;align-items:center;gap:2px;margin-bottom:10px;cursor:pointer}
.wb{flex:1;min-width:2px;border-radius:2px;background:var(--cyan)}
.wb.p{opacity:.8}.wb.u{opacity:.2}
.tls{display:flex;gap:8px;flex-wrap:wrap}
.tl{flex:1;min-width:80px;padding:8px;border-radius:8px;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--gb);font-size:11px;font-weight:500;color:var(--muted);text-decoration:none;display:block}

/* AVAILABILITY */
.avail-chips{display:flex;gap:6px;flex-wrap:wrap}
.ach{display:flex;align-items:center;gap:6px;background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.2);border-radius:20px;padding:6px 12px}
.ad{width:5px;height:5px;border-radius:50%;background:var(--green);flex-shrink:0}
.adate{font-size:11px;font-weight:600;color:var(--green)}

/* BADGES */
.bgr{display:flex;gap:6px;flex-wrap:wrap}
.bp{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:11px;font-weight:600}
.bpf{background:rgba(212,160,23,.1);border:1px solid rgba(212,160,23,.28);color:var(--gold)}
.bpv{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);color:var(--white)}
.bpc{background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.22);color:var(--cyan)}
.bpg{background:rgba(29,158,117,.08);border:1px solid rgba(29,158,117,.2);color:var(--green)}

/* LINKS */
.lkl{display:flex;flex-direction:column}
.lk{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);text-decoration:none;-webkit-tap-highlight-color:transparent}
.lk:last-child{border-bottom:none}
.lic{width:32px;height:32px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.lt{flex:1;min-width:0}
.ln{font-size:12px;font-weight:600;color:var(--white)}
.lh{font-size:11px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lar svg{width:14px;height:14px;stroke:var(--dim)}

/* PRESS QUOTES */
.qtl{display:flex;flex-direction:column;gap:14px}
.qt{padding-left:12px;border-left:2px solid rgba(0,210,255,.35)}
.qb{font-size:13px;font-style:italic;color:#CCC;line-height:1.65}
.qs{font-size:10px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.5px}

/* PAST GIGS */
.gigs-list{display:flex;flex-direction:column}
.gig-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.gig-row:last-child{border-bottom:none}
.gig-date{min-width:42px;text-align:center;line-height:1.2}
.gig-day{font-size:16px;font-weight:700;letter-spacing:-.3px;display:block}
.gig-mon{font-size:9px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.gig-info{flex:1;min-width:0}
.gig-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig-venue{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig-badge{font-size:9px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0}
.gig-badge.done{background:rgba(29,158,117,.1);border:1px solid rgba(29,158,117,.2);color:var(--green)}
.gig-badge.conf{background:rgba(0,210,255,.08);border:1px solid rgba(0,210,255,.18);color:var(--cyan)}

/* MEDIA */
.mgd{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mc{aspect-ratio:1;border-radius:6px;background:rgba(255,255,255,.04);border:1px solid var(--gb);overflow:hidden;position:relative;cursor:pointer}
.mc img{width:100%;height:100%;object-fit:cover;display:block}
.mc-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mc-play svg{width:28px;height:28px}
.mc-empty{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--dim)}

/* REVIEWS */
.rev-list{display:flex;flex-direction:column}
.rev{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.rev:last-child{border-bottom:none}
.rev-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.rev-by{font-size:12px;font-weight:600}
.rev-stars{display:flex;gap:2px}
.rev-star{font-size:12px;color:var(--gold)}.rev-star.off{color:var(--dim)}
.rev-body{font-size:12px;color:#CCC;line-height:1.6}
.rev-date{font-size:10px;color:var(--muted);margin-top:4px}

/* FOOTER / ACTION BAR / NOT FOUND */
.pft{text-align:center;padding:24px 0 20px;font-size:11px;color:var(--dim)}
.pft a{color:var(--muted);text-decoration:none;font-weight:600}
.pft a .d{color:var(--cyan)}
.nfs{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:40px;text-align:center;gap:12px}
.nfs h2{font-size:20px;font-weight:700;margin-top:8px}
.nfs p{font-size:14px;color:var(--muted)}
.nfs a{color:var(--cyan);text-decoration:none;font-size:13px;font-weight:500;margin-top:4px}
.abar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--max);padding:12px 14px max(12px,env(safe-area-inset-bottom));background:rgba(9,9,15,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--gb);display:none;gap:8px;z-index:50}
.bfl{flex:1;padding:13px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--gb);background:rgba(255,255,255,.06);color:var(--white);font-family:inherit;transition:all .15s}
.bfl.on{color:var(--cyan);border-color:rgba(0,210,255,.3);background:rgba(0,210,255,.06)}
.bsh{width:46px;height:46px;flex-shrink:0;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid var(--gb);display:flex;align-items:center;justify-content:center;cursor:pointer}
.bsh svg{width:16px;height:16px;stroke:var(--muted)}
</style>
</head>
<body>

<div id="bg"><div id="bgi"></div><div id="bgg"></div></div>
<div id="spp"><div class="spdot offline" id="spd"></div><span id="spl"></span></div>

<div id="ld">
  <div class="brand"><span class="w">set<span class="d">drop</span></span></div>
  <div class="spin"></div>
  <div class="ldm">Loading profile</div>
</div>

<div id="prf" style="display:none">
  <div id="pg">
    <div class="hero">
      <div class="avw">
        <div class="av" id="av"></div>
        <div class="vbdg" id="vbdg" style="display:none"><svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="var(--cyan)"/><path d="M7 12.5l3.5 3.5 6.5-7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      </div>
      <div class="nm" id="nm">—</div>
      <div class="hnd" id="hnd"></div>
      <div class="pills" id="pills"></div>
      <div id="fbadge-wrap" style="display:none"></div>
    </div>

    <div class="stats">
      <div class="si"><div class="sv c" id="sf">0</div><div class="sl">Followers</div></div>
      <div class="si"><div class="sv" id="sg">0</div><div class="sl">Gigs</div></div>
      <div class="si"><div class="sv" id="sr">—</div><div class="sl">Rating</div></div>
      <div class="si"><div class="sv" id="sy">—</div><div class="sl">Years</div></div>
    </div>

    <div class="sec" id="sa"><div class="si2"><div class="sh"><div class="st">About</div></div><div class="abt" id="abt"></div></div></div>

    <div class="sec" id="strk"><div class="trk">
      <div class="sh" style="margin-bottom:14px"><div class="st">Featured Track</div></div>
      <div class="tt"><button class="pb" id="pb" onclick="togglePlay()"><svg id="pico" viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></button><div class="ti"><div class="tn" id="tn">—</div><div class="tm" id="tm"></div></div></div>
      <div class="wf" id="wf" onclick="scrub(event)"></div>
      <div class="tls" id="tls"></div>
    </div></div>

    <div class="sec" id="sav" style="display:none"><div class="si2"><div class="sh"><div class="st">Available to Book</div></div><div class="avail-chips" id="avr"></div></div></div>
    <div class="sec" id="sbg" style="display:none"><div class="si2"><div class="sh"><div class="st">Badges</div></div><div class="bgr" id="bgr"></div></div></div>
    <div class="sec" id="slk" style="display:none"><div class="si2"><div class="sh"><div class="st">Find Me</div></div><div class="lkl" id="lkl"></div></div></div>
    <div class="sec" id="sqt" style="display:none"><div class="si2"><div class="sh"><div class="st">Press</div></div><div class="qtl" id="qtl"></div></div></div>
    <div class="sec" id="sgigs" style="display:none"><div class="si2"><div class="sh"><div class="st">Gig History</div></div><div class="gigs-list" id="gigs-list"></div></div></div>
    <div class="sec" id="smd" style="display:none"><div class="si2"><div class="sh"><div class="st">Media</div></div><div class="mgd" id="mgd"></div></div></div>
    <div class="sec" id="srev" style="display:none"><div class="si2"><div class="sh"><div class="st">Reviews</div><span id="rev-count" style="font-size:11px;color:var(--muted)"></span></div><div class="rev-list" id="rev-list"></div></div></div>

    <div class="pft"><a href="/"><span class="w">set<span class="d">drop</span></span> — Get your profile</a></div>
  </div>
</div>

<div id="nf" style="display:none">
  <div class="nfs"><div class="brand"><span class="w">set<span class="d">drop</span></span></div><h2>Profile not found</h2><p>This artist does not exist or their profile is private.</p><a href="/">Back to Setdrop</a></div>
</div>

<div class="abar" id="abar">
  <button class="bfl" id="bfl" onclick="toggleFollow()">Follow</button>
  <button class="bsh" onclick="doShare()"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></button>
</div>

<script>
const SB='https://hlqmsujjnwicclyecpkz.supabase.co';
const K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhscW1zdWpqbndpY2NseWVjcGt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM1NTU0NDcsImV4cCI6MjA4OTEzMTQ0N30.BTgsCMxNZ1SYJf6lEpsVucm1qwJ4phmp1ooWeuX6HxQ';
const H={apikey:K,Authorization:`Bearer ${K}`};

const PL={instagram:{l:'Instagram',bg:'rgba(225,48,108,.12)',c:'#E1306C'},spotify:{l:'Spotify',bg:'rgba(30,215,96,.1)',c:'#1ED760'},soundcloud:{l:'SoundCloud',bg:'rgba(255,85,0,.1)',c:'#FF5500'},tiktok:{l:'TikTok',bg:'rgba(255,255,255,.07)',c:'#F0F0FF'},youtube:{l:'YouTube',bg:'rgba(255,0,0,.1)',c:'#FF4444'},mixcloud:{l:'Mixcloud',bg:'rgba(82,46,140,.15)',c:'#7B52AE'},bandcamp:{l:'Bandcamp',bg:'rgba(29,201,179,.1)',c:'#1DC9B3'},website:{l:'Website',bg:'rgba(255,255,255,.06)',c:'#888AAA'}};
const FEAT={founding_artist:{cls:'founding',label:'Founding Artist',icon:'★'},verified:{cls:'verified',label:'Verified Artist'},top_artist:{cls:'top',label:'Top Artist'},open_to_collab:{cls:'collab',label:'Open to Collab'}};

function slug(){const m=window.location.pathname.match(/\/@([^/]+)/);return m?m[1]:(new URLSearchParams(window.location.search).get('u')||'demo');}

async function load(u){
  const r=await fetch(`${SB}/rest/v1/artist_profiles?username=eq.${encodeURIComponent(u)}&select=*&limit=1`,{headers:H});
  if(!r.ok)return null;
  const rows=await r.json();if(!rows.length)return null;
  const p=rows[0];
  const[links,badges,cfgRows,followers,gigCount,reviews,bookings]=await Promise.all([
    fetch(`${SB}/rest/v1/artist_links?artist_id=eq.${p.id}&order=sort_order.asc`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/artist_badges?artist_id=eq.${p.id}`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/artist_profile_config?artist_id=eq.${p.id}&limit=1`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/follows?following_id=eq.${p.id}&select=id`,{headers:{...H,Prefer:'count=exact',Range:'0-0'}}).then(r=>{const h=r.headers.get('content-range');return h?parseInt(h.split('/')[1]):0;}).catch(()=>0),
    fetch(`${SB}/rest/v1/bookings?artist_id=eq.${p.id}&status=eq.completed&select=id`,{headers:{...H,Prefer:'count=exact',Range:'0-0'}}).then(r=>{const h=r.headers.get('content-range');return h?parseInt(h.split('/')[1]):0;}).catch(()=>0),
    fetch(`${SB}/rest/v1/reviews?reviewee_id=eq.${p.id}&select=overall,comment,submitted_at&order=submitted_at.desc&limit=5`,{headers:H}).then(r=>r.ok?r.json():[]),
    fetch(`${SB}/rest/v1/bookings?artist_id=eq.${p.id}&select=id,fee,status,gig_id,org_id&order=created_at.desc&limit=8`,{headers:H}).then(r=>r.ok?r.json():[]),
  ]);
  const cfg=cfgRows[0]||null;
  let gigDetails={},orgDetails={};
  if(bookings.length){
    const gids=[...new Set(bookings.map(b=>b.gig_id).filter(Boolean))];
    const oids=[...new Set(bookings.map(b=>b.org_id).filter(Boolean))];
    const[gr,or]=await Promise.all([
      gids.length?fetch(`${SB}/rest/v1/gig_postings?id=in.(${gids.map(i=>`"${i}"`).join(',')})&select=id,title,event_date,location_city`,{headers:H}).then(r=>r.ok?r.json():[]):Promise.resolve([]),
      oids.length?fetch(`${SB}/rest/v1/org_profiles?id=in.(${oids.map(i=>`"${i}"`).join(',')})&select=id,org_name`,{headers:H}).then(r=>r.ok?r.json():[]):Promise.resolve([]),
    ]);
    gigDetails=Object.fromEntries(gr.map(g=>[g.id,g]));
    orgDetails=Object.fromEntries(or.map(o=>[o.id,o]));
  }
  return{...p,links,badges,cfg,followers,gigCount,reviews,bookings,gigDetails,orgDetails};
}

function render(p){
  document.title=`${p.stage_name} (@${p.username}) · Setdrop`;

  // Fixed background — banner_url (cover image), falls back to photo_url
  const bgSrc=p.banner_url||p.photo_url;
  if(bgSrc){const bgi=document.getElementById('bgi');bgi.style.backgroundImage=`url(${bgSrc})`;setTimeout(()=>bgi.classList.add('on'),60);}

  // Avatar
  const av=document.getElementById('av');
  if(p.photo_url)av.innerHTML=`<img src="${p.photo_url}" alt="">`;
  else av.textContent=(p.stage_name||'?')[0].toUpperCase();
  if(p.verified)document.getElementById('vbdg').style.display='flex';

  document.getElementById('nm').textContent=p.stage_name||p.username;
  document.getElementById('hnd').textContent=`@${p.username}`;

  const pills=document.getElementById('pills');
  (p.artist_type||[]).forEach(t=>{const d=document.createElement('div');d.className='tp';d.textContent=t;pills.appendChild(d);});
  (p.genres||[]).forEach(g=>{const d=document.createElement('div');d.className='gp';d.textContent=g;pills.appendChild(d);});

  // Featured badge from artist_profile_config.featured_badge_type
  const ft=p.cfg?.featured_badge_type;
  if(ft&&FEAT[ft]){const fc=FEAT[ft],w=document.getElementById('fbadge-wrap');w.innerHTML=`<div class="fbadge ${fc.cls}">${fc.icon?fc.icon+' ':''}<span>${fc.label}</span></div>`;w.style.display='block';}

  // Status — fixed top-left
  const sp=document.getElementById('spp'),dot=document.getElementById('spd'),lbl=document.getElementById('spl');
  if(p.live_now){dot.className='spdot live';lbl.textContent='Live Now';sp.style.display='inline-flex';}
  else if(p.available){dot.className='spdot online';lbl.textContent='Available';sp.style.display='inline-flex';}

  // Stats: Followers · Gigs · Rating · Years
  const yr=p.created_at?Math.max(1,new Date().getFullYear()-new Date(p.created_at).getFullYear()):1;
  const avg=p.reviews?.length?(p.reviews.reduce((s,r)=>s+(r.overall||0),0)/p.reviews.length).toFixed(1):'—';
  document.getElementById('sf').textContent=fmt(p.followers||0);
  document.getElementById('sg').textContent=p.gigCount||0;
  document.getElementById('sr').textContent=avg;
  document.getElementById('sy').textContent=yr;

  // About
  const bio=p.bio_full||p.bio_short;
  if(bio)document.getElementById('abt').textContent=bio;
  else document.getElementById('sa').style.display='none';

  // Track
  buildWF();document.getElementById('tn').textContent='No featured track set';document.getElementById('tm').textContent=p.stage_name||'';

  // Availability
  if(p.available){document.getElementById('avr').innerHTML=`<div class="ach"><div class="ad"></div><span class="adate">Available to book</span></div>${p.open_to_collab?'<div class="ach"><div class="ad"></div><span class="adate">Open to collab</span></div>':''}`;document.getElementById('sav').style.display='block';}

  // Badges
  const br=document.getElementById('bgr');
  const bd=[
    {show:p.badges?.some(b=>b.badge_type==='founding_artist'),cls:'bpf',label:'Founding Artist',svg:`<svg viewBox="0 0 24 24" width="11" height="11"><path d="M12 2l2 7h7l-5.5 4 2 7L12 16l-5.5 4 2-7L3 9h7z" fill="var(--gold)"/></svg>`},
    {show:p.verified,cls:'bpv',label:'Verified',svg:`<svg viewBox="0 0 24 24" fill="none" width="11" height="11"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5"/><path d="M8 12l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`},
    {show:p.open_to_collab,cls:'bpg',label:'Open to Collab',svg:`<svg viewBox="0 0 24 24" fill="none" width="11" height="11"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="7" r="4" stroke="currentColor" stroke-width="1.5"/></svg>`},
  ];
  let hb=false;
  bd.forEach(b=>{if(!b.show)return;const e=document.createElement('div');e.className=`bp ${b.cls}`;e.innerHTML=`${b.svg}<span>${b.label}</span>`;br.appendChild(e);hb=true;});
  if(hb)document.getElementById('sbg').style.display='block';

  // Links
  if(p.links?.length){const ll=document.getElementById('lkl');p.links.slice(0,6).forEach(lk=>{const cfg=PL[lk.platform?.toLowerCase()]||PL.website;const e=document.createElement('a');e.className='lk';e.href=lk.url||'#';e.target='_blank';e.rel='noopener';e.innerHTML=`<div class="lic" style="background:${cfg.bg};color:${cfg.c}">${cfg.l[0]}</div><div class="lt"><div class="ln">${esc(cfg.l)}</div><div class="lh">${esc(lk.label||lk.url||'')}</div></div><div class="lar"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M7 7h10v10"/></svg></div>`;ll.appendChild(e);});document.getElementById('slk').style.display='block';}

  // Press quotes from cfg.press_quotes
  const quotes=p.cfg?.press_quotes||[];
  if(quotes.length){const qtl=document.getElementById('qtl');quotes.forEach(q=>{const e=document.createElement('div');e.className='qt';e.innerHTML=`<div class="qb">"${esc(q.quote||q.body||'')}"</div><div class="qs">${esc(q.source||q.publication||'')}</div>`;qtl.appendChild(e);});document.getElementById('sqt').style.display='block';}

  // Past gigs
  if(p.bookings?.length){const gl=document.getElementById('gigs-list');p.bookings.forEach(b=>{const gig=p.gigDetails[b.gig_id]||{},org=p.orgDetails[b.org_id]||{};const dt=gig.event_date?new Date(gig.event_date):null;const day=dt?dt.getDate():'—';const mon=dt?dt.toLocaleString('en-AU',{month:'short'}).toUpperCase():'';const isC=b.status==='completed';const e=document.createElement('div');e.className='gig-row';e.innerHTML=`<div class="gig-date"><span class="gig-day">${day}</span><span class="gig-mon">${mon}</span></div><div class="gig-info"><div class="gig-title">${esc(gig.title||'Gig')}</div><div class="gig-venue">${esc(org.org_name||'')}${gig.location_city?` · ${esc(gig.location_city)}`:''}</div></div><span class="gig-badge ${isC?'done':'conf'}">${isC?'Verified':'Confirmed'}</span>`;gl.appendChild(e);});document.getElementById('sgigs').style.display='block';}

  // Media
  const vids=p.video_embeds||[];
  if(vids.length){const mgd=document.getElementById('mgd');vids.slice(0,4).forEach(v=>{const e=document.createElement('div');e.className='mc';if(v.thumbnail_url){e.innerHTML=`<img src="${esc(v.thumbnail_url)}" alt="" loading="lazy"><div class="mc-play"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.55)"/><polygon points="9,7 19,12 9,17" fill="white"/></svg></div>`;e.onclick=()=>v.url&&window.open(v.url,'_blank');}else{e.innerHTML='<div class="mc-empty">▶</div>';}mgd.appendChild(e);});document.getElementById('smd').style.display='block';}

  // Reviews
  if(p.reviews?.length){const rl=document.getElementById('rev-list');document.getElementById('rev-count').textContent=`${p.reviews.length} review${p.reviews.length!==1?'s':''}`;p.reviews.forEach(rev=>{const stars=Array.from({length:5},(_,i)=>`<span class="rev-star${i<Math.round(rev.overall||0)?'':' off'}">★</span>`).join('');const dt=rev.submitted_at?new Date(rev.submitted_at).toLocaleDateString('en-AU',{month:'short',year:'numeric'}):'';const e=document.createElement('div');e.className='rev';e.innerHTML=`<div class="rev-top"><div class="rev-by">Verified Booking</div><div class="rev-stars">${stars}</div></div>${rev.comment?`<div class="rev-body">${esc(rev.comment)}</div>`:''}<div class="rev-date">${dt}</div>`;rl.appendChild(e);});document.getElementById('srev').style.display='block';}
}

const WH=[28,45,68,88,76,55,42,72,94,82,62,48,38,58,78,68,50,38,62,82];
let ph=0,playing=false,wt=null;
function buildWF(){document.getElementById('wf').innerHTML=WH.map((h,i)=>`<div class="wb ${i<ph?'p':'u'}" style="height:${h}%"></div>`).join('');}
function togglePlay(){playing=!playing;document.getElementById('pico').innerHTML=playing?'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>':'<polygon points="5,3 19,12 5,21"/>';if(playing){wt=setInterval(()=>{if(ph<WH.length){ph++;buildWF();}else{clearInterval(wt);playing=false;ph=0;buildWF();document.getElementById('pico').innerHTML='<polygon points="5,3 19,12 5,21"/>';}},1000);}else clearInterval(wt);buildWF();}
function scrub(e){const r=e.currentTarget.getBoundingClientRect();ph=Math.round((e.clientX-r.left)/r.width*WH.length);buildWF();}
let fol=false;
function toggleFollow(){fol=!fol;const b=document.getElementById('bfl');b.textContent=fol?'Following':'Follow';b.className=`bfl${fol?' on':''}`;}
function doShare(){if(navigator.share)navigator.share({url:location.href}).catch(()=>{});else navigator.clipboard?.writeText(location.href);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return n>=1000?(n/1000).toFixed(1).replace(/\.0$/,'')+'k':String(n);}

(async()=>{
  const u=slug();
  if(u==='demo'){
    document.getElementById('ld').classList.add('gone');
    document.getElementById('prf').style.display='block';
    document.getElementById('abar').style.display='flex';
    render({stage_name:'Alfred Jay',username:'alfredjay',bio_short:'Melbourne based DJ. Electronic, house, and everything in between.',bio_full:'Melbourne based DJ and producer. Electronic and house sounds across venues and festivals.',artist_type:['DJ'],genres:['Electronic','House','Techno'],verified:false,available:true,open_to_collab:true,live_now:false,photo_url:null,banner_url:null,followers:0,gigCount:0,reviews:[],bookings:[],gigDetails:{},orgDetails:{},links:[{platform:'instagram',url:'https://instagram.com/setdrop.au',label:'@setdrop.au'}],badges:[{badge_type:'founding_artist'}],cfg:{featured_badge_type:'founding_artist',press_quotes:[]},video_embeds:[]});
    return;
  }
  try{
    const p=await load(u);
    document.getElementById('ld').classList.add('gone');
    if(!p){document.getElementById('nf').style.display='flex';return;}
    document.getElementById('prf').style.display='block';
    document.getElementById('abar').style.display='flex';
    render(p);
  }catch(err){console.error(err);document.getElementById('ld').querySelector('.ldm').textContent='Could not load profile';document.getElementById('ld').querySelector('.spin').style.display='none';}
})();
</script>
