<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Artist — Setdrop</title>
<meta name="description" content="Artist profile on Setdrop — the booking platform built for independent artists.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#00D2FF;--base:#09090F;--radius:12px;
  --sec-bg:rgba(9,9,15,0.52);--sec-border:rgba(0,210,255,0.12);
  --white:#F0F0FF;--muted:#888AAA;--dim:#3A3A5A;--green:#1D9E75;
}
html{background:var(--base);min-height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--base);color:var(--white);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;display:flex;flex-direction:column;align-items:center}
.phone{width:100%;max-width:430px;min-height:100vh;position:relative;display:flex;flex-direction:column}
.bg-wrap{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:100vh;z-index:0;overflow:hidden;pointer-events:none}
.bg-img{position:absolute;inset:0;background:var(--base);background-size:cover;background-position:center top;will-change:transform}
.bg-grad{position:absolute;inset:0}
.bg-tex{position:absolute;inset:0;opacity:0.07}
.topbar{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:max(14px,env(safe-area-inset-top)) 16px 14px;background:rgba(9,9,15,0.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.06);width:100%}
.tb-brand{font-size:17px;font-weight:700;letter-spacing:-0.3px;text-decoration:none}
.tb-brand .s{color:var(--white)}.tb-brand .d{color:var(--accent)}
.tb-right{display:flex;align-items:center;gap:8px}
.tb-btn{padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:opacity 0.15s;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1}
.btn-p{background:var(--accent);color:var(--base)}.btn-p:hover{opacity:0.88}
.btn-o{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);color:var(--white)}.btn-o:hover{background:rgba(255,255,255,0.11)}
.content{position:relative;z-index:10;display:flex;flex-direction:column;flex:1;padding:0 10px 56px}
.hero{padding:88px 6px 18px;display:flex;flex-direction:column;align-items:center;text-align:center}
.hero.classic{align-items:flex-start;text-align:left}
.status-pill{display:inline-flex;align-items:center;gap:5px;background:rgba(5,5,8,0.72);border:0.5px solid rgba(255,255,255,0.10);border-radius:20px;padding:4px 10px;margin-bottom:16px}
.sdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sdot.online{background:#1D9E75}.sdot.offline{background:#888AAA}
.sdot.live{background:#A32D2D;animation:sp 1.4s ease-in-out infinite}
.sdot.broadcast{background:var(--accent);animation:sp 1.4s ease-in-out infinite}
.slbl{font-size:9px;color:#888AAA;font-weight:500}
@keyframes sp{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.4);opacity:1}}
.avatar{width:80px;height:80px;border-radius:50%;border:2px solid var(--accent);background:rgba(0,0,0,0.38);object-fit:cover;display:block;margin-bottom:12px;flex-shrink:0}
.avatar.sq{border-radius:14px}
.avatar-fb{width:80px;height:80px;border-radius:50%;border:2px solid var(--accent);background:rgba(0,0,0,0.38);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--accent);margin-bottom:12px;flex-shrink:0}
.avatar-fb.sq{border-radius:14px}
.hero-name{font-size:22px;font-weight:700;color:var(--white);letter-spacing:-0.44px;display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:4px;flex-wrap:wrap}
.hero.classic .hero-name{justify-content:flex-start}
.vbadge svg{width:16px;height:16px;flex-shrink:0}
.tagline{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.genre-pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.hero.classic .genre-pills{justify-content:flex-start}
.gpill{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent)}
.sections{display:flex;flex-direction:column;gap:7px}
.sec{border-radius:var(--radius);background:var(--sec-bg);border:0.5px solid var(--sec-border);padding:12px 14px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.sec.ghost{background:rgba(9,9,15,0.14);backdrop-filter:blur(6px)}
.sec.solid{background:rgba(9,9,15,0.96);backdrop-filter:none}
.sec.line{background:transparent;border-color:rgba(255,255,255,0.08);backdrop-filter:none}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-lbl{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:0.8px;text-transform:uppercase}
.sec-link{font-size:11px;font-weight:600;color:var(--accent);text-decoration:none}.sec-link:hover{opacity:0.8}
.stats-row{display:flex;justify-content:space-around;text-align:center;padding:12px 0;border-radius:var(--radius);background:var(--sec-bg);border:0.5px solid var(--sec-border);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stat-val{font-size:20px;font-weight:700;letter-spacing:-0.5px;color:var(--white)}
.stat-lbl{font-size:10px;color:var(--muted);font-weight:500;margin-top:2px}
.stat-sep{width:0.5px;background:rgba(255,255,255,0.08);margin:4px 0}
.bio{font-size:13px;color:#CCCCCC;line-height:1.65}
.track-row{display:flex;align-items:center;gap:12px}
.tplay{width:40px;height:40px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:opacity 0.15s;border:none}
.tplay:hover{opacity:0.88}
.tplay svg{width:14px;height:14px;fill:var(--base);margin-left:2px}
.tname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.tmeta{font-size:11px;color:var(--muted)}
.waveform{display:flex;align-items:center;gap:2px;height:28px;margin-top:10px}
.wbar{flex:1;border-radius:2px;background:var(--accent);opacity:0.72;animation:wv 1.2s ease-in-out infinite alternate}
@keyframes wv{from{height:15%}to{height:90%}}
.lrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.05);text-decoration:none}
.lrow:first-child{padding-top:0}.lrow:last-child{border-bottom:none;padding-bottom:0}
.licon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:color-mix(in srgb,var(--accent) 14%,transparent)}
.licon svg{width:14px;height:14px;fill:var(--accent)}
.ltext{flex:1;min-width:0}
.lplatform{font-size:13px;font-weight:600;color:var(--white)}
.lhandle{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.larrow svg{width:12px;height:12px;stroke:var(--dim);fill:none}
.press-list{display:flex;flex-direction:column;gap:14px}
.press-item{padding-left:12px;position:relative}
.pborder{position:absolute;left:0;top:0;bottom:0;width:2px;border-radius:2px;background:var(--accent)}
.pborder.dim{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.pq{font-size:12px;color:#CCCCCC;line-height:1.65;font-style:italic}
.psrc{font-size:10px;color:var(--muted);margin-top:4px}
.badges-wrap{display:flex;flex-wrap:wrap;gap:5px}
.bdg{font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px}
.bdg-f{background:rgba(250,199,117,0.1);border:1px solid rgba(250,199,117,0.28);color:#FAC775}
.bdg-t{background:color-mix(in srgb,var(--accent) 10%,transparent);border:1px solid color-mix(in srgb,var(--accent) 28%,transparent);color:var(--accent)}
.bdg-v{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);color:var(--white)}
.bdg-m{background:rgba(29,158,117,0.1);border:1px solid rgba(29,158,117,0.22);color:#1D9E75}
.avail-row{display:flex;gap:8px;flex-wrap:wrap}
.avchip{display:flex;flex-direction:column;align-items:flex-start;background:rgba(29,158,117,0.08);border:1px solid rgba(29,158,117,0.2);border-radius:9px;padding:7px 11px;gap:2px}
.av-top{display:flex;align-items:center;gap:5px}
.avdot{width:5px;height:5px;border-radius:50%;background:#1D9E75;flex-shrink:0}
.avdate{font-size:13px;font-weight:600;color:var(--white)}
.avmonth{font-size:10px;color:var(--muted)}
.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.mcell{border-radius:8px;background:rgba(255,255,255,0.04);aspect-ratio:1;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.mcell img{width:100%;height:100%;object-fit:cover}
.mcell-more{position:absolute;inset:0;background:rgba(0,0,0,0.62);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--white)}
.profile-footer{text-align:center;padding:28px 0 16px;display:flex;flex-direction:column;align-items:center;gap:14px}
.footer-cta{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 20px;border-radius:14px;background:rgba(0,210,255,0.05);border:0.5px solid rgba(0,210,255,0.14);width:100%;text-align:center}
.footer-cta-t{font-size:14px;font-weight:600;margin-bottom:2px}
.footer-cta-s{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.5}
.footer-btn{background:var(--accent);color:var(--base);padding:10px 28px;border-radius:9px;font-weight:700;font-size:13px;text-decoration:none;display:inline-block;transition:opacity 0.15s}
.footer-btn:hover{opacity:0.88}
.footer-brand{font-size:12px;color:var(--dim);text-decoration:none}
.footer-brand span{color:var(--accent);font-weight:700}
.state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:40px 20px}
.state-icon{width:56px;height:56px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.state h2{font-size:20px;font-weight:700;margin-bottom:8px}
.state p{font-size:14px;color:var(--muted);max-width:280px;line-height:1.6}
.state a{color:var(--accent);text-decoration:none;font-weight:600;margin-top:16px;display:inline-block}
@media(min-width:500px){body{background:#050508}.phone{box-shadow:0 0 0 0.5px rgba(255,255,255,0.07),0 32px 80px rgba(0,0,0,0.6)}}
</style>
</head>
<body>

  </div>

    <a class="tb-brand" href="/"><span class="s">set</span><span class="d">drop</span></a>

      <a class="tb-btn btn-p" href="/">Get early access</a>

  <div class="content" id="content">
    <div class="state">
      <div class="state-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-7 8-7s8 3 8 7"/></svg></div>
      <h2>Loading profile</h2><p>Hang tight.</p>
    </div>
  </div>
</div>
<script>

const H={apikey:K,Authorization:`Bearer ${K}`};
function getSlug(){const m=window.location.pathname.match(/^\/@?([^\/]+)$/);if(m&&m[1])return m[1];return new URLSearchParams(window.location.search).get('u');}
async function q(p){try{const r=await fetch(SB+p,{headers:H});return r.ok?r.json():null;}catch{return null;}}
function hexA(h,a){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return `rgba(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)},${a})`;}
function sv(k,v){document.documentElement.style.setProperty(k,v)}
function applyTokens(p){
  const ac=p.accent_colour||'#00D2FF',base=p.base_colour||'#09090F',st=p.section_style||'glass';
  sv('--accent',ac);sv('--base',base);
  sv('--radius',{rounded:'12px',sharp:'4px',pill:'20px',flat:'0px'}[p.corner_radius]||'12px');
  sv('--sec-border',hexA(ac,0.14));
  if(st==='ghost'){sv('--sec-bg',hexA(base,0.14));sv('--sec-border',hexA(ac,0.22));}
  else if(st==='solid'){sv('--sec-bg',hexA(base,0.96));sv('--sec-border',hexA(ac,0.08));}

  else{sv('--sec-bg',hexA(base,0.52));}
  document.documentElement.style.background=base;document.body.style.background=base;
  document.getElementById('bg-grad').style.background=`linear-gradient(to bottom,transparent 0%,transparent 40%,${hexA(base,0.65)} 65%,${base} 100%)`;
  const bg=document.getElementById('bg-img');
  const src=p.background_image_url||p.photo_url;
  if(src){bg.style.cssText=`position:absolute;inset:0;background:url(${src}) center top/cover no-repeat;will-change:transform;${!p.background_image_url?'filter:brightness(0.3) saturate(0.8)':''}`;}
  else{bg.style.background=base;}
}
function drawTexture(type,hex){
  const c=document.getElementById('bg-tex');c.width=window.innerWidth;c.height=window.innerHeight;
  const ctx=c.getContext('2d');
  const r=parseInt((hex||'#00d2ff').slice(1,3),16),g=parseInt((hex||'#00d2ff').slice(3,5),16),b=parseInt((hex||'#00d2ff').slice(5,7),16);
  const col=a=>`rgba(${r},${g},${b},${a})`;
  if(type==='scanline'){ctx.strokeStyle=col(0.35);ctx.lineWidth=0.5;for(let y=0;y<c.height;y+=4){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke();}}
  else if(type==='dots'){for(let x=0;x<c.width;x+=18)for(let y=0;y<c.height;y+=18){ctx.beginPath();ctx.arc(x,y,0.7,0,Math.PI*2);ctx.fillStyle=col(0.9);ctx.fill();}}
  else if(type==='diagonal'){ctx.strokeStyle=col(0.25);ctx.lineWidth=0.8;for(let i=-c.height;i<c.width+c.height;i+=20){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+c.height,c.height);ctx.stroke();}}
  else if(type==='hex'){const s=18,h=s*Math.sqrt(3)/2;ctx.strokeStyle=col(0.22);ctx.lineWidth=0.5;for(let row=0;row*h<c.height+h;row++)for(let col2=0;col2*s*1.5<c.width+s;col2++){const x=col2*s*1.5,y=row*h+(col2%2?h/2:0);ctx.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);i===0?ctx.moveTo(x+s*Math.cos(a),y+s*Math.sin(a)):ctx.lineTo(x+s*Math.cos(a),y+s*Math.sin(a));}ctx.closePath();ctx.stroke();}}
}

502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 002.088-2.088 31.247 31.247 0 00.5-5.783 31.247 31.247 0 00-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/>',facebook:'<path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>',twitter:'<path d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z"/>',bandcamp:'<path d="M0 18.75l7.437-13.5H24l-7.438 13.5z"/>',soundcloud:'<path d="M11.56 8.87V17h8.76c1.94 0 3.49-1.56 3.49-3.49 0-1.93-1.55-3.49-3.49-3.49a3.4 3.4 0 00-.99.14 5.25 5.25 0 00-5.26-4.73 5.25 5.25 0 00-2.51.44zm-1.16.38c-.37-.1-.75-.15-1.14-.15-2.42 0-4.38 1.96-4.38 4.38S6.84 17.86 9.26 17.86h.14V9.25z"/>',beatport:'<path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm0 4.8a3.6 3.6 0 110 7.2 3.6 3.6 0 010-7.2zm0 13.2a7.2 7.2 0 110-14.4 7.2 7.2 0 010 14.4z"/>',};
function ico(p){const k=(p||'').toLowerCase(),d=ICO[k];return d?`<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${d}</svg>`:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/></svg>`;}
function vbadge(ac){return `<span class="vbadge"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="${ac}"/><path d="M8 12l2.5 2.5L16 9" stroke="#09090F" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;}
function waveform(){return `<div class="waveform">${Array.from({length:20},(_,i)=>`<div class="wbar" style="animation-delay:${(i*0.07).toFixed(2)}s;animation-duration:${(1+Math.random()*0.5).toFixed(2)}s"></div>`).join('')}</div>`;}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(s){const d=new Date(s);return{day:d.getDate(),month:d.toLocaleDateString('en-AU',{month:'short'})};}

function render(p,links,badges,cfg){
  const ac=p.accent_colour||'#00D2FF';
  const st=p.section_style||'glass';
  const SC=st&&st!=='glass'?`sec ${st}`:'sec';
  const sq=p.avatar_shape==='square';
  const classic=p.header_layout==='classic';
  const hidden=p.hidden_sections||[];
  const press=(cfg&&cfg.press_quotes)||[];
  applyTokens(p);
  const tex=p.bg_texture||'clean';
  if(tex&&tex!=='clean')drawTexture(tex,ac);
  document.title=`${p.stage_name} — Setdrop`;
  const av=p.photo_url?`<img class="avatar${sq?' sq':''}" src="${esc(p.photo_url)}" alt="${esc(p.stage_name)}" loading="lazy">`:`<div class="avatar-fb${sq?' sq':''}">${esc((p.stage_name||'?').charAt(0).toUpperCase())}</div>`;
  const genres=(p.genres||[]).map(g=>`<span class="gpill">${esc(g)}</span>`).join('');
  const stats=`<div class="stats-row"><div><div class="stat-val">0</div><div class="stat-lbl">Gigs</div></div><div class="stat-sep"></div><div><div class="stat-val">—</div><div class="stat-lbl">Years active</div></div><div class="stat-sep"></div><div><div class="stat-val">—</div><div class="stat-lbl">Rating</div></div><div class="stat-sep"></div><div><div class="stat-val">0</div><div class="stat-lbl">Followers</div></div></div>`;
  const bio=(p.bio_full||p.bio_short)?`<div class="${SC}"><div class="bio">${esc(p.bio_full||p.bio_short)}</div></div>`:'';
  const track=`<div class="${SC}"><div class="sec-hdr"><div class="sec-lbl">Featured Track</div></div><div class="track-row"><button class="tplay" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button><div><div class="tname">Add your track in the app</div><div class="tmeta">SoundCloud · Beatport · Spotify</div></div></div>${waveform()}</div>`;
  const linksHtml=!hidden.includes('links')&&links.length?`<div class="${SC}"><div class="sec-hdr"><div class="sec-lbl">Links</div></div>${links.slice(0,6).map(l=>`<a class="lrow" href="${esc(l.url)}" target="_blank" rel="noopener"><div class="licon">${ico(l.platform)}</div><div class="ltext"><div class="lplatform">${esc(l.label||l.platform)}</div><div class="lhandle">${esc((l.url||'').replace(/^https?:\/\//,''))}</div></div><div class="larrow"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><path d="M7 17L17 7M7 7h10v10"/></svg></div></a>`).join('')}</div>`:'';
  const pressHtml=!hidden.includes('press_quotes')&&press.length?`<div class="${SC}"><div class="sec-hdr"><div class="sec-lbl">Press</div></div><div class="press-list">${press.map((q,i)=>`<div class="press-item"><div class="pborder${i>0?' dim':''}"></div><div class="pq">${esc(q.quote)}</div><div class="psrc">${esc(q.source||'')}</div></div>`).join('')}</div></div>`:'';
  const badgesHtml=!hidden.includes('badges')&&badges.length?`<div class="${SC}"><div class="sec-hdr"><div class="sec-lbl">Badges</div></div><div class="badges-wrap">${badges.map(b=>{if(b.badge_type==='founding_artist')return`<span class="bdg bdg-f">★ Founding Artist</span>`;if(b.badge_type==='top_rated')return`<span class="bdg bdg-t">Top Rated</span>`;if(b.badge_type==='verified')return`<span class="bdg bdg-v">✓ Verified</span>`;return`<span class="bdg bdg-m">${esc(b.badge_type.replace(/_/g,' '))}</span>`;}).join('')}</div></div>`:'';
  const availDates=(p.available&&p.availability_dates)?(p.availability_dates||[]).slice(0,3):[];
  const availHtml=!hidden.includes('availability')&&availDates.length?`<div class="${SC}"><div class="sec-hdr"><div class="sec-lbl">Available</div></div><div class="avail-row">${availDates.map(d=>{const{day,month}=fmtDate(d);return`<div class="avchip"><div class="av-top"><div class="avdot"></div><div class="avdate">${day}</div></div><div class="avmonth">${month}</div></div>`;}).join('')}</div></div>`:'';
  document.getElementById('content').innerHTML=`<div class="${classic?'hero classic':'hero'}"><div class="status-pill"><div class="sdot ${p.live_now?'live':'offline'}"></div><span class="slbl">${p.live_now?'Live now':'Offline'}</span></div>${av}<div class="hero-name">${esc(p.stage_name)}${p.verified?vbadge(ac):''}</div><div class="tagline">${esc((p.bio_short||'').slice(0,80)||'Artist on Setdrop')}</div><div class="genre-pills">${genres}</div></div><div class="sections">${stats}${bio}${track}${linksHtml}${pressHtml}${badgesHtml}${availHtml}</div><div class="profile-footer"><div class="footer-cta"><div class="footer-cta-t">Book ${esc(p.stage_name)}</div><div class="footer-cta-s">Join Setdrop to send a booking enquiry.</div><a class="footer-btn" href="/">Get early access</a></div><a class="footer-brand" href="/"><span>set</span>drop &nbsp;·&nbsp; Independent artist bookings</a></div>`;
  document.getElementById('tbr').innerHTML=`<a class="tb-btn btn-o" href="/">Follow</a><a class="tb-btn btn-p" href="/">Get early access</a>`;
  initParallax();
}

function showError(msg){document.getElementById('content').innerHTML=`<div class="state"><div class="state-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg></div><h2>Profile not found</h2><p>${esc(msg)}</p><a href="/">Back to Setdrop</a></div>`;}

async function boot(){
  const slug=getSlug();
  if(!slug){showError('No username in URL. Use /@username.');return;}
  const rows=await q(`/rest/v1/artist_profiles?username=eq.${encodeURIComponent(slug)}&limit=1`);
  if(!rows||!rows.length){showError(`No artist found at @${slug}.`);return;}
  const p=rows[0];
  const[links,badges,cfgRows]=await Promise.all([
    q(`/rest/v1/artist_links?artist_id=eq.${p.id}&order=sort_order.asc&limit=6`),
    q(`/rest/v1/artist_badges?artist_id=eq.${p.id}&limit=20`),
    q(`/rest/v1/artist_profile_config?artist_id=eq.${p.id}&limit=1`),
  ]);
  render(p,links||[],badges||[],cfgRows&&cfgRows[0]||null);
}
boot().catch(()=>showError('Something went wrong loading this profile.'));
</script>
</body>
</html>
